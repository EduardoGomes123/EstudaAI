<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudaí</title>
<meta name="description" content="Tire foto do quadro e o Estudaí organiza suas provas. Tire foto do caderno e ele cria resumo, flashcards e simulado.">
<meta name="theme-color" content="#5B3DF5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudaí">
<style>
  :root{
    --roxo:#5B3DF5; --roxo2:#7C62FF; --roxo-claro:#EEEAFF;
    --verde:#12B886; --verde-claro:#E3F9F1;
    --laranja:#F76707; --laranja-claro:#FFF0E5;
    --vermelho:#E03131; --vermelho-claro:#FFE8E8;
    --azul:#1C7ED6; --azul-claro:#E7F2FD;
    --texto:#1D1B2C; --suave:#6B6880; --borda:#E6E3F0; --fundo:#F7F6FB; --card:#fff;
    --raio:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
  header{padding:calc(18px + env(safe-area-inset-top)) 2px 8px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:24px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
  .logo span{color:var(--roxo)}
  .data-hoje{color:var(--suave);font-size:14px}
  .data-hoje::first-letter{text-transform:uppercase}
  h2{font-size:20px;margin:22px 2px 10px}
  h3{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--suave);margin:20px 4px 8px}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);padding:14px}
  .botao{border:0;border-radius:14px;padding:14px 16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px}
  .primario{background:var(--roxo);color:#fff;box-shadow:0 6px 18px rgba(91,61,245,.28)}
  .primario:active{transform:scale(.98)}
  .secundario{background:var(--roxo-claro);color:var(--roxo)}
  .fantasma{background:transparent;color:var(--suave);font-weight:600}
  .botao:disabled{opacity:.5}
  .linha{display:flex;gap:10px}
  .linha > *{flex:1}
  .hero{background:linear-gradient(135deg,var(--roxo),var(--roxo2));color:#fff;border-radius:22px;padding:18px;margin-top:6px}
  .hero p{margin:4px 0 14px;opacity:.92}
  .hero .titulo{font-size:19px;font-weight:800}
  .hero .botao{background:#fff;color:var(--roxo);box-shadow:none}
  .hero .botao.claro{background:rgba(255,255,255,.18);color:#fff}
  .aviso{background:var(--laranja-claro);color:#8a3a00;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
  .lista{display:flex;flex-direction:column;gap:10px}
  .tarefa{display:flex;gap:12px;align-items:flex-start}
  .check{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--borda);background:#fff;display:grid;place-items:center;margin-top:2px}
  .check.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .tarefa .corpo{flex:1;min-width:0}
  .tarefa .t{font-weight:700}
  .tarefa.feita .t{text-decoration:line-through;color:var(--suave)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--suave)}
  .tag{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
  .tag.prova{background:var(--vermelho-claro);color:var(--vermelho)}
  .tag.trabalho{background:var(--azul-claro);color:var(--azul)}
  .tag.dever{background:var(--verde-claro);color:#087f5b}
  .tag.apresentacao{background:var(--laranja-claro);color:var(--laranja)}
  .tag.outro{background:#F1F0F5;color:var(--suave)}
  .quando{font-weight:700}
  .quando.urgente{color:var(--vermelho)}
  .det{font-size:14px;color:var(--suave);margin-top:4px;white-space:pre-wrap}
  .acoes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .mini{border:0;background:#F3F1FA;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--texto)}
  .mini.roxo{background:var(--roxo-claro);color:var(--roxo)}
  .vazio{text-align:center;color:var(--suave);padding:26px 10px}
  .vazio .em{font-size:40px}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--borda);padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:10}
  nav .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
  nav button{flex:1;min-width:0;border:0;background:transparent;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--suave)}
  nav button .i{font-size:22px}
  nav button.ativo{background:var(--roxo-claro);color:var(--roxo)}
  .material{display:flex;gap:12px;align-items:center}
  .material .icone{flex:0 0 46px;height:46px;border-radius:14px;background:var(--roxo-claro);display:grid;place-items:center;font-size:22px}
  .material .corpo{flex:1;min-width:0}
  .material .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .fotos .f{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#eee}
  .fotos img{width:100%;height:100%;object-fit:cover}
  .fotos .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
  .fotos .add{border:2px dashed var(--borda);display:grid;place-items:center;color:var(--suave);font-weight:700;font-size:13px;background:#fff;text-align:center;padding:6px}
  label.campo{display:block;font-size:13px;font-weight:700;color:var(--suave);margin:10px 0 4px}
  input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--borda);border-radius:12px;padding:11px 12px;background:#fff}
  textarea{resize:vertical;min-height:60px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .folha{background:var(--fundo);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .folha .topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .folha .topo b{font-size:18px}
  .fechar{border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;border:1px solid var(--borda)}
  .sugestao{border:2px solid var(--roxo);}
  .sugestao.off{border-color:var(--borda);opacity:.6}
  .carregando{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
  .spinner{width:54px;height:54px;border-radius:50%;border:5px solid var(--roxo-claro);border-top-color:var(--roxo);animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--texto);color:#fff;padding:11px 16px;border-radius:12px;z-index:70;font-size:14px;max-width:90vw;text-align:center}
  /* estudo */
  .abas{display:flex;background:#ECEAF4;border-radius:14px;padding:4px;margin:12px 0}
  .abas button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 2px;font-weight:700;color:var(--suave);font-size:13px;white-space:nowrap}
  .abas button.ativo{background:#fff;color:var(--roxo);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .resumo li{margin:0 0 10px}
  .resumo{padding-left:20px;margin:0}
  .flash{perspective:1000px;height:260px;margin:8px 0 14px}
  .flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .flash.virado .in{transform:rotateY(180deg)}
  .flash .lado{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;font-size:20px;font-weight:700}
  .flash .frente{background:#fff;border:1px solid var(--borda)}
  .flash .verso{background:var(--roxo);color:#fff;transform:rotateY(180deg);font-weight:600;font-size:18px}
  .flash small{position:absolute;bottom:14px;font-size:12px;font-weight:600;opacity:.6}
  .progresso{height:8px;background:#ECEAF4;border-radius:99px;overflow:hidden;margin:6px 0 4px}
  .progresso > div{height:100%;background:var(--roxo);border-radius:99px;transition:width .3s}
  .opcao{display:block;width:100%;text-align:left;border:2px solid var(--borda);background:#fff;border-radius:14px;padding:13px 14px;margin:8px 0;font-weight:600}
  .opcao.certa{border-color:var(--verde);background:var(--verde-claro)}
  .opcao.errada{border-color:var(--vermelho);background:var(--vermelho-claro)}
  .explica{background:#fff;border-radius:14px;padding:12px 14px;border-left:4px solid var(--roxo);margin:10px 0;font-size:15px}
  .placar{text-align:center;padding:16px 6px}
  .placar .n{font-size:52px;font-weight:900;color:var(--roxo)}
  .pequeno{font-size:13px;color:var(--suave)}
  .oculto{display:none!important}
  .link{background:none;border:0;color:var(--roxo);font-weight:700;padding:6px;text-decoration:underline}
  /* mapa mental */
  .mapa-caixa{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);overflow:auto;-webkit-overflow-scrolling:touch;max-height:62vh}
  .mapa-caixa img{display:block;width:100%;height:auto}
  .mapa-caixa.zoom img{width:240%;max-width:none}
  /* feedback */
  .topo-dir{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .carinhas{display:flex;justify-content:space-between;gap:6px;margin:8px 0 4px}
  .carinhas button{flex:1;border:2px solid var(--borda);background:#fff;border-radius:14px;font-size:30px;padding:8px 0;line-height:1}
  .carinhas button.ativo{border-color:var(--roxo);background:var(--roxo-claro);transform:scale(1.06)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chips button{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
  .chips button.ativo{background:var(--roxo);border-color:var(--roxo);color:#fff}
  .curtiu{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:10px 12px;background:#fff;border:1px dashed var(--borda);border-radius:14px;font-size:14px;font-weight:600;color:var(--suave)}
  .curtiu .bt{display:flex;gap:6px}
  .curtiu button{border:1px solid var(--borda);background:#fff;border-radius:10px;font-size:20px;padding:4px 10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">📚 <div>Estuda<span>í</span></div></div>
    <div class="topo-dir">
      <button class="mini roxo" id="btnFeedback">💬 Opinar</button>
      <div class="data-hoje" id="dataHoje"></div>
    </div>
  </header>

  <!-- ================= AGENDA ================= -->
  <section id="telaAgenda">
    <div class="hero">
      <div class="titulo">Tirou foto, tá anotado.</div>
      <p>Fotografe o quadro, a agenda ou o bilhete da escola. Eu encontro as provas e trabalhos e organizo as datas.</p>
      <div class="linha">
        <button class="botao" id="btnFotoAgenda">📷 Fotografar</button>
        <button class="botao claro" id="btnManual" style="flex:0 0 auto;width:auto;padding:14px 18px">＋</button>
      </div>
    </div>
    <div id="resumoDia"></div>
    <div id="listaTarefas"></div>
  </section>

  <!-- ================= CRONOGRAMA ================= -->
  <section id="telaCrono" class="oculto"><div id="conteudoCrono"></div></section>

  <!-- ================= ESTUDAR ================= -->
  <section id="telaEstudar" class="oculto">
    <div class="hero">
      <div class="titulo">Do caderno pro simulado.</div>
      <p>Fotografe as páginas do caderno ou do livro. Eu crio resumo, flashcards e um simulado pra você treinar.</p>
      <button class="botao" id="btnNovoEstudo">📷 Fotografar o caderno</button>
    </div>
    <div class="linha" style="margin-top:12px">
      <button class="card" id="btnEnem" style="text-align:left;font-weight:700">🎯 Questões<br><span class="pequeno" style="font-weight:600">estilo ENEM</span></button>
      <button class="card" id="btnOlimp" style="text-align:left;font-weight:700">🏅 Olimpíadas<br><span class="pequeno" style="font-weight:600">OBMEP, OBM, Canguru…</span></button>
    </div>
    <div id="listaMateriais"></div>
  </section>
</div>

<nav>
  <div class="in">
    <button id="navAgenda" class="ativo"><span class="i">🗓️</span>Agenda</button>
    <button id="navCrono"><span class="i">⏰</span>Cronograma</button>
    <button id="navEstudar"><span class="i">🧠</span>Estudar</button>
  </div>
</nav>

<input type="file" id="arquivoAgenda" accept="image/*" capture="environment" class="oculto">
<input type="file" id="arquivoEstudo" accept="image/*" multiple class="oculto">
<input type="file" id="arquivoEstudoCamera" accept="image/*" capture="environment" class="oculto">
<input type="file" id="arquivoHorario" accept="image/*" class="oculto">

<div id="camadaModal"></div>

<script>
/* ============================================================
   Estudaí — protótipo
   Dados ficam só neste aparelho (localStorage).
   A IA roda na função /api/ia (Gemini).
   ============================================================ */

const API = "/api/ia";
const CHAVE = "estudai.v1";
const TIPOS = { prova: "Prova", trabalho: "Trabalho", dever: "Dever", apresentacao: "Apresentação", outro: "Outro" };
const MATERIAS = ["Matemática","Português","História","Geografia","Ciências","Biologia","Física","Química","Inglês","Espanhol","Artes","Educação Física","Redação","Filosofia","Sociologia"];

/* ---------- armazenamento ---------- */
function carregar() {
  try {
    const d = JSON.parse(localStorage.getItem(CHAVE));
    if (d && d.tarefas && d.materiais) { d.feitosCrono = d.feitosCrono || {}; d.rotina = d.rotina || null; return d; }
  } catch (e) {}
  return { tarefas: [], materiais: [], rotina: null, feitosCrono: {} };
}
let estado = carregar();
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(estado)); }
  catch (e) { toast("Não consegui salvar no aparelho. A memória pode estar cheia."); }
}
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function hojeISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function diasAte(iso) {
  if (!iso) return null;
  const a = new Date(hojeISO() + "T12:00:00"), b = new Date(iso + "T12:00:00");
  return Math.round((b - a) / 86400000);
}
function textoQuando(iso) {
  const n = diasAte(iso);
  if (n === null) return "Sem data";
  if (n < 0) return n === -1 ? "Ontem" : `Há ${-n} dias`;
  if (n === 0) return "Hoje";
  if (n === 1) return "Amanhã";
  const d = new Date(iso + "T12:00:00");
  const sem = d.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "");
  const dm = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  return n < 7 ? `${sem}, ${dm} · em ${n} dias` : `${sem}, ${dm}`;
}
function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function carregando(msg) {
  const el = document.createElement("div"); el.className = "carregando";
  el.innerHTML = `<div class="spinner"></div><b style="font-size:18px">${esc(msg)}</b><div class="pequeno">Isso leva uns segundinhos…</div>`;
  document.body.appendChild(el); return () => el.remove();
}

/* ---------- fotos: reduz antes de enviar ---------- */
function reduzirFoto(arquivo, lado = 1400, qualidade = 0.72) {
  return new Promise((ok, erro) => {
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const esc = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL("image/jpeg", qualidade);
      ok({ mime: "image/jpeg", data: dataUrl.split(",")[1], preview: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("Não consegui abrir essa foto.")); };
    img.src = url;
  });
}

/* ---------- chamada da IA ---------- */
async function chamarIA(corpo) {
  let r;
  try {
    r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(corpo) });
  } catch (e) {
    throw new Error("Sem conexão com a internet. Confira o Wi-Fi ou os dados móveis.");
  }
  if (r.status === 404) throw new Error("SEM_SERVIDOR");
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || "A IA não respondeu. Tente de novo.");
  return j;
}
function erroIA(e, demo) {
  if (e.message === "SEM_SERVIDOR") {
    abrirModal(`
      <div class="topo"><b>Modo prévia</b><button class="fechar" data-fechar>✕</button></div>
      <p>A IA só funciona depois que o app estiver publicado na Vercel com a chave do Gemini. Por enquanto, você pode ver como fica com um exemplo pronto.</p>
      <button class="botao primario" id="btnDemo">Ver com exemplo</button>`);
    $("#btnDemo").onclick = () => { fecharModal(); demo(); };
  } else {
    toast(e.message, 4000);
  }
}

/* ---------- modal ---------- */
function abrirModal(html) {
  $("#camadaModal").innerHTML = `<div class="modal"><div class="folha">${html}</div></div>`;
  const m = $("#camadaModal .modal");
  m.addEventListener("click", (ev) => { if (ev.target === m || ev.target.closest("[data-fechar]")) fecharModal(); });
  document.body.style.overflow = "hidden";
}
function fecharModal() { $("#camadaModal").innerHTML = ""; document.body.style.overflow = ""; }

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function irPara(tela) {
  for (const [t, sec, nav] of [["agenda", "#telaAgenda", "#navAgenda"], ["crono", "#telaCrono", "#navCrono"], ["estudar", "#telaEstudar", "#navEstudar"]]) {
    $(sec).classList.toggle("oculto", tela !== t);
    $(nav).classList.toggle("ativo", tela === t);
  }
  window.scrollTo(0, 0);
  if (tela === "agenda") renderAgenda();
  if (tela === "crono") renderCronograma();
  if (tela === "estudar") renderMateriais();
}
$("#navAgenda").onclick = () => irPara("agenda");
$("#navCrono").onclick = () => irPara("crono");
$("#navEstudar").onclick = () => irPara("estudar");

/* ============================================================
   AGENDA
   ============================================================ */
function renderAgenda() {
  const pend = estado.tarefas.filter((t) => !t.feito);
  // resumo do dia
  const hoje = pend.filter((t) => diasAte(t.data) === 0);
  const amanha = pend.filter((t) => diasAte(t.data) === 1);
  const atras = pend.filter((t) => t.data && diasAte(t.data) < 0);
  const provasSemana = pend.filter((t) => t.tipo === "prova" && diasAte(t.data) >= 0 && diasAte(t.data) <= 7);
  let aviso = "";
  if (atras.length) aviso += `⚠️ ${atras.length} ${atras.length === 1 ? "atividade atrasada" : "atividades atrasadas"}. `;
  if (hoje.length) aviso += `📌 Hoje: ${hoje.map((t) => esc(t.titulo)).join(", ")}. `;
  if (amanha.length) aviso += `⏰ Amanhã: ${amanha.map((t) => esc(t.titulo)).join(", ")}. `;
  if (!aviso && provasSemana.length) aviso = `📝 ${provasSemana.length} ${provasSemana.length === 1 ? "prova" : "provas"} nos próximos 7 dias. Bora estudar?`;
  $("#resumoDia").innerHTML = aviso ? `<div class="aviso">${aviso}</div>` : "";

  if (!estado.tarefas.length) {
    $("#listaTarefas").innerHTML = `
      <div class="vazio"><div class="em">🗒️</div>
        <p>Nada anotado ainda.<br>Tire foto do quadro quando o professor passar uma prova ou trabalho.</p>
        <button class="link" id="btnExemploAgenda">Ver um exemplo</button>
      </div>`;
    $("#btnExemploAgenda").onclick = () => mostrarSugestoes(DEMO_TAREFAS(), true);
    return;
  }

  const grupos = [
    ["Atrasadas", (t) => !t.feito && t.data && diasAte(t.data) < 0],
    ["Hoje e amanhã", (t) => !t.feito && t.data && diasAte(t.data) >= 0 && diasAte(t.data) <= 1],
    ["Próximos 7 dias", (t) => !t.feito && t.data && diasAte(t.data) > 1 && diasAte(t.data) <= 7],
    ["Mais pra frente", (t) => !t.feito && t.data && diasAte(t.data) > 7],
    ["Sem data", (t) => !t.feito && !t.data],
    ["Feitas", (t) => t.feito],
  ];
  const ordenar = (a, b) => (a.data || "9999").localeCompare(b.data || "9999");
  let html = "";
  for (const [nome, filtro] of grupos) {
    let itens = estado.tarefas.filter(filtro).sort(ordenar);
    if (!itens.length) continue;
    if (nome === "Feitas") itens = itens.reverse().slice(0, 8);
    html += `<h3>${nome}</h3><div class="lista">${itens.map(cardTarefa).join("")}</div>`;
  }
  $("#listaTarefas").innerHTML = html;
}

function cardTarefa(t) {
  const n = diasAte(t.data);
  const urg = !t.feito && n !== null && n <= 1;
  const temMaterial = estado.materiais.some((m) => m.tarefaId === t.id);
  const podeEstudar = ["prova", "trabalho", "apresentacao"].includes(t.tipo);
  return `
  <div class="card tarefa ${t.feito ? "feita" : ""}" data-id="${t.id}">
    <button class="check ${t.feito ? "on" : ""}" data-acao="feito" aria-label="Marcar como feita">${t.feito ? "✓" : ""}</button>
    <div class="corpo">
      <div class="t">${esc(t.titulo)}</div>
      <div class="meta">
        <span class="tag ${t.tipo}">${TIPOS[t.tipo] || "Outro"}</span>
        ${t.materia ? `<span>${esc(t.materia)}</span> ·` : ""}
        <span class="quando ${urg ? "urgente" : ""}">${textoQuando(t.data)}</span>
      </div>
      ${t.detalhes ? `<div class="det">${esc(t.detalhes)}</div>` : ""}
      ${t.feito ? "" : `<div class="acoes">
        ${podeEstudar ? `<button class="mini roxo" data-acao="estudar">${temMaterial ? "🧠 Revisar" : "🧠 Estudar pra isso"}</button>` : ""}
        ${t.data ? `<button class="mini" data-acao="lembrete">⏰ Lembrete</button>` : ""}
        <button class="mini" data-acao="editar">✏️</button>
      </div>`}
    </div>
  </div>`;
}

/* lembrete: arquivo de calendário com alerta na véspera */
function baixarLembrete(t) {
  const d = t.data.replace(/-/g, "");
  const fim = new Date(t.data + "T12:00:00"); fim.setDate(fim.getDate() + 1);
  const dFim = fim.toISOString().slice(0, 10).replace(/-/g, "");
  const agora = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const limpar = (s) => String(s || "").replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const nome = `${TIPOS[t.tipo]}${t.materia ? " de " + t.materia : ""}: ${t.titulo}`;
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Estudai//PT-BR", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT", `UID:${t.id}@estudai`, `DTSTAMP:${agora}`,
    `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${dFim}`,
    `SUMMARY:${limpar(nome)}`, `DESCRIPTION:${limpar(t.detalhes)}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${limpar("Amanhã: " + nome)}`, "TRIGGER:-PT6H", "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${limpar("Faltam 3 dias: " + nome)}`, "TRIGGER:-P2DT6H", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `lembrete-${t.titulo.slice(0, 30).replace(/[^\w\-]+/g, "-")}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Abra o arquivo para adicionar ao calendário. Ele avisa 3 dias antes e na véspera às 18h.", 4500);
}

let fotosEstudo = [];
function novoEstudo(tarefa) {
  fotosEstudo = [];
  const provas = estado.tarefas.filter((t) => !t.feito && ["prova", "trabalho", "apresentacao"].includes(t.tipo)).sort((a, b) => (a.data || "9").localeCompare(b.data || "9"));
  const desenhar = () => {
    abrirModal(`
      <div class="topo"><b>Estudar pelo caderno</b><button class="fechar" data-fechar>✕</button></div>
      <label class="campo">É pra qual prova ou trabalho? (opcional)</label>
      <select id="eTarefa">
        <option value="">Só quero estudar</option>
        ${provas.map((t) => `<option value="${t.id}" ${tarefa && tarefa.id === t.id ? "selected" : ""}>${esc(TIPOS[t.tipo])}: ${esc(t.titulo)}${t.data ? " (" + textoQuando(t.data) + ")" : ""}</option>`).join("")}
      </select>
      <label class="campo">Fotos das páginas (${fotosEstudo.length}/6)</label>
      <div class="fotos">
        ${fotosEstudo.map((f, i) => `<div class="f"><img src="${f.preview}" alt="Página ${i + 1}"><button class="x" data-rm="${i}">✕</button></div>`).join("")}
        ${fotosEstudo.length < 6 ? `<button class="f add" id="eCamera">📷<br>Tirar foto</button><button class="f add" id="eGaleria">🖼️<br>Da galeria</button>` : ""}
      </div>
      <p class="pequeno">Dica: uma página por foto, reta, com boa luz. As fotos não ficam guardadas em lugar nenhum.</p>
      <button class="botao primario" id="eGerar" ${fotosEstudo.length ? "" : "disabled"}>✨ Criar resumo, flashcards e simulado</button>`);
    document.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { fotosEstudo.splice(+b.dataset.rm, 1); tarefa = tarefaSel(); desenhar(); });
    const cam = $("#eCamera"), gal = $("#eGaleria");
    if (cam) cam.onclick = () => { tarefa = tarefaSel(); $("#arquivoEstudoCamera").click(); };
    if (gal) gal.onclick = () => { tarefa = tarefaSel(); $("#arquivoEstudo").click(); };
    $("#eGerar").onclick = gerar;
  };
  const tarefaSel = () => estado.tarefas.find((t) => t.id === $("#eTarefa").value) || null;
  const adicionar = async (ev) => {
    const arqs = [...ev.target.files].slice(0, 6 - fotosEstudo.length); ev.target.value = "";
    for (const a of arqs) { try { fotosEstudo.push(await reduzirFoto(a)); } catch (e) { toast(e.message); } }
    desenhar();
  };
  $("#arquivoEstudo").onchange = adicionar;
  $("#arquivoEstudoCamera").onchange = adicionar;

  async function gerar() {
    const t = tarefaSel();
    const parar = carregando("Lendo seu caderno e montando o material…");
    try {
      const r = await chamarIA({
        modo: "estudo",
        fotos: fotosEstudo.map((f) => ({ mime: f.mime, data: f.data })),
        materia: t ? t.materia : "", assunto: t ? `${t.titulo} ${t.detalhes || ""}` : "",
      });
      parar();
      if (r.erro) { toast(r.erro, 4500); return; }
      const m = validarMaterial(r);
      if (!m) { toast("Não consegui montar o material com essas fotos. Tente fotos mais nítidas.", 4500); return; }
      fecharModal(); salvarMaterial(m, t);
    } catch (e) {
      parar();
      erroIA(e, () => { fecharModal(); salvarMaterial(DEMO_MATERIAL(), t); });
    }
  }
  desenhar();
}

function validarMaterial(r) {
  const resumo = (Array.isArray(r.resumo) ? r.resumo : []).map(String).filter(Boolean).slice(0, 15);
  const flashcards = (Array.isArray(r.flashcards) ? r.flashcards : []).filter((c) => c && c.frente && c.verso).map((c) => ({ frente: String(c.frente), verso: String(c.verso) })).slice(0, 20);
  const quiz = (Array.isArray(r.quiz) ? r.quiz : []).filter((q) => q && q.pergunta && Array.isArray(q.opcoes) && q.opcoes.length >= 2 && Number.isInteger(q.correta) && q.correta >= 0 && q.correta < q.opcoes.length)
    .map((q) => ({ pergunta: String(q.pergunta), opcoes: q.opcoes.map(String), correta: q.correta, explicacao: String(q.explicacao || "") })).slice(0, 20);
  if (!resumo.length && !flashcards.length && !quiz.length) return null;
  const titulo = String(r.titulo || "Material de estudo").slice(0, 80);
  return { titulo, materia: String(r.materia || "").slice(0, 40), resumo, flashcards, quiz, mapa: validarMapa(r.mapa, titulo) };
}

function salvarMaterial(m, tarefa, aba = "resumo") {
  const novo = { ...m, id: novoId(), tarefaId: tarefa ? tarefa.id : null, criado: Date.now(), melhorNota: null };
  if (tarefa && !novo.materia) novo.materia = tarefa.materia;
  estado.materiais.push(novo); salvar(); renderMateriais(); abrirMaterial(novo.id, aba);
}

function mostrarAba(m, aba) {
  document.querySelectorAll("[data-aba]").forEach((b) => b.classList.toggle("ativo", b.dataset.aba === aba));
  const c = $("#conteudoAba");
  if (aba === "resumo") {

         <div style="height:12px"></div><button class="botao secundario" id="irMapa">${m.banco ? "Resolver as questões →" : "Ver o mapa mental →"}</button>
         ${blocoCurtiu(m)}`

    const b = $("#irMapa"); if (b) b.onclick = () => mostrarAba(m, m.banco ? "quiz" : "mapa");
    ligarCurtiu(m);
  }

  if (aba === "flash") rodarFlashcards(m, c, m.flashcards.map((_, i) => i));
  if (aba === "quiz") rodarQuiz(m, c);
}

/* ---------- mapa mental (imagem) ---------- */
function umEmoji(e) {
  const s = String(e || "").trim();
  if (!s || /[A-Za-z0-9À-ú]/.test(s)) return "";
  if (window.Intl && Intl.Segmenter) {
    const g = [...new Intl.Segmenter("pt", { granularity: "grapheme" }).segment(s)];
    return g.length ? g[0].segment : "";
  }
  return Array.from(s).slice(0, 2).join("");
}

function validarMapa(x, titulo) {
  if (!x || !Array.isArray(x.ramos)) return null;
  let comFoto = 0;
  const ramos = x.ramos
    .filter((r) => r && r.titulo)
    .slice(0, 6)
    .map((r) => {
      const foto = String(r.foto || "").trim().slice(0, 80);
      const dado = r.dado && r.dado.valor ? { valor: String(r.dado.valor).slice(0, 18), rotulo: String(r.dado.rotulo || "").slice(0, 40) } : null;
      return {
        titulo: String(r.titulo).slice(0, 60),
        icone: umEmoji(r.icone),
        foto: foto && comFoto++ < 3 ? foto : "",
        dado,
        itens: (Array.isArray(r.itens) ? r.itens : [])
          .map((i) => (typeof i === "string" ? { texto: i, icone: "" } : { texto: String(i?.texto || ""), icone: umEmoji(i?.icone) }))
          .filter((i) => i.texto).slice(0, 5).map((i) => ({ ...i, texto: i.texto.slice(0, 90) })),
      };
    });
  if (ramos.length < 2) return null;
  return {
    centro: String(x.centro || titulo || "Tema").slice(0, 60),
    icone: umEmoji(x.icone),
    foto: String(x.foto || "").trim().slice(0, 80),
    macete: String(x.macete || "").slice(0, 200),
    ramos,
  };
}

// Sem internet / modo prévia: monta um mapa simples a partir do material
const ICONES_RAMO = ["💡", "📌", "🔎", "⭐", "🧩", "✅"];
function mapaLocal(m) {
  const curto = (t, n) => { const p = String(t).split(/\s+/); return p.length > n ? p.slice(0, n).join(" ") + "…" : p.join(" "); };
  const base = m.flashcards.length >= 3
    ? m.flashcards.slice(0, 6).map((c) => ({ titulo: curto(c.frente.replace(/\?$/, ""), 5), itens: [curto(c.verso, 10)] }))
    : m.resumo.slice(0, 6).map((t) => { const [a, ...b] = t.split(/:\s+|\.\s+/); return { titulo: curto(a, 4), itens: [curto(b.join(". ") || t, 10)] }; });
  return {
    centro: curto(m.titulo, 5), icone: iconeMateria(m.materia), foto: "", macete: "",
    ramos: base.map((r, i) => ({ titulo: r.titulo, icone: ICONES_RAMO[i % 6], foto: "", dado: null, itens: r.itens.map((t) => ({ texto: t, icone: "👉" })) })),
  };
}

/* fotos da Wikipédia (grátis, com licença livre) */
const _fotos = new Map();
async function buscarFoto(termo) {
  if (!termo) return null;
  if (_fotos.has(termo)) return _fotos.get(termo);
  const tarefa = (async () => {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 7000);
    try {
      const q = `https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch=${encodeURIComponent(termo)}&prop=pageimages&piprop=thumbnail&pithumbsize=500`;
      const j = await (await fetch(q, { signal: ctrl.signal })).json();
      const pag = j && j.query && Object.values(j.query.pages || {})[0];
      const src = pag && pag.thumbnail && pag.thumbnail.source;
      if (!src || /\.svg/i.test(src) && !/\.png$/i.test(src)) return null;
      const blob = await (await fetch(src, { signal: ctrl.signal })).blob();
      if (!blob.type.startsWith("image/")) return null;
      if (window.createImageBitmap) return await createImageBitmap(blob);
      return await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = URL.createObjectURL(blob); });
    } catch (e) { return null; }
    finally { clearTimeout(t); }
  })();
  _fotos.set(termo, tarefa);
  const r = await tarefa;
  if (!r) _fotos.delete(termo);
  return r;
}

let _medidor;
const FONTE = `system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
const FONTE_SVG = `system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji`;
function quebrarLinhas(texto, maxPx, fonte) {
  _medidor = _medidor || document.createElement("canvas").getContext("2d");
  _medidor.font = `${fonte} ${FONTE}`;
  const cabe = (t) => _medidor.measureText(t).width <= maxPx;
  const palavras = String(texto).split(/\s+/).filter(Boolean); const linhas = []; let atual = "";
  for (let p of palavras) {
    while (!cabe(p) && p.length > 4) {
      let k = p.length - 1; while (k > 3 && !cabe(p.slice(0, k) + "-")) k--;
      if (atual) { linhas.push(atual); atual = ""; }
      linhas.push(p.slice(0, k) + "-"); p = p.slice(k);
    }
    if (!atual) atual = p;
    else if (cabe(atual + " " + p)) atual += " " + p;
    else { linhas.push(atual); atual = p; }
  }
  if (atual) linhas.push(atual);
  return linhas;
}

const CORES_MAPA = ["#5B3DF5", "#12B886", "#F76707", "#1C7ED6", "#D6336C", "#F59F00"];

// Monta o desenho. "fotos" = { termo: imagem }. Devolve o SVG e onde colar cada foto.
function desenharMapa(mapa, fotos = {}) {
  const M = 40, W = 1760, CX = W / 2, LH_ITEM = 30, LH_RAMO = 32, GAP_ITEM = 14, GAP_BLOCO = 44;
  const CW = 340, RW = 260, IW = 300;
  const xml = (t) => esc(t);
  const colar = [];
  let svg = "";

  // centro
  const fotoC = fotos[mapa.foto];
  const centroL = quebrarLinhas(mapa.centro, CW - 40, "900 34px");
  const topoC = fotoC ? 214 : mapa.icone ? 90 : 20;
  const centroH = topoC + centroL.length * 44 + 30;

  // ramos
  const blocos = mapa.ramos.map((r, i) => {
    const foto = fotos[r.foto];
    const tl = quebrarLinhas(r.titulo, RW - 30, "800 26px");
    const topo = 14 + (foto ? 142 : 0) + (r.icone ? 52 : 6);
    const ramoH = topo + tl.length * LH_RAMO + (r.dado ? 96 : 0) + 18;
    const itens = r.itens.map((it) => {
      const l = quebrarLinhas(it.texto, IW - (it.icone ? 66 : 32), "600 22px");
      return { ...it, l, h: Math.max(l.length * LH_ITEM + 22, it.icone ? 56 : 0) };
    });
    const itensH = itens.reduce((a, b) => a + b.h, 0) + Math.max(0, itens.length - 1) * GAP_ITEM;
    return { r, foto, tl, topo, ramoH, itens, h: Math.max(ramoH, itensH), cor: CORES_MAPA[i % CORES_MAPA.length], lado: i % 2 === 0 ? 1 : -1 };
  });
  const lados = { 1: blocos.filter((b) => b.lado === 1), "-1": blocos.filter((b) => b.lado === -1) };
  const alturaLado = (l) => l.reduce((a, b) => a + b.h, 0) + Math.max(0, l.length - 1) * GAP_BLOCO;
  const TOPO = 80;
  const corpoH = Math.max(alturaLado(lados[1]), alturaLado(lados["-1"]), centroH);
  const CY = TOPO + corpoH / 2;

  // macete
  const maceteL = mapa.macete ? quebrarLinhas(mapa.macete, W - 2 * M - 150, "700 26px") : [];
  const maceteH = maceteL.length ? maceteL.length * 36 + 66 : 0;
  const temFoto = !!fotoC || blocos.some((b) => b.foto);
  const H = TOPO + corpoH + 40 + (maceteH ? maceteH + 24 : 0) + 60;

  let ligacoes = "", caixas = "";
  for (const k of [1, -1]) {
    const lista = lados[k];
    let y = TOPO + (corpoH - alturaLado(lista)) / 2;
    for (const b of lista) {
      const ramoX = k === 1 ? CX + CW / 2 + 60 : CX - CW / 2 - 60 - RW;
      const itemX = k === 1 ? ramoX + RW + 40 : ramoX - 40 - IW;
      const ramoY = y + (b.h - b.ramoH) / 2;
      const ramoMY = ramoY + b.ramoH / 2;
      const x0 = CX + k * (CW / 2), x1 = k === 1 ? ramoX : ramoX + RW;
      ligacoes += `<path d="M${x0},${CY} C${(x0 + x1) / 2},${CY} ${(x0 + x1) / 2},${ramoMY} ${x1},${ramoMY}" stroke="${b.cor}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
      caixas += `<rect x="${ramoX}" y="${ramoY}" width="${RW}" height="${b.ramoH}" rx="22" fill="${b.cor}"/>`;
      let cy = ramoY + 14;
      if (b.foto) {
        caixas += `<rect x="${ramoX + 14}" y="${cy}" width="${RW - 28}" height="130" rx="14" fill="#ffffff" opacity="0.25"/>`;
        colar.push({ img: b.foto, x: ramoX + 14, y: cy, w: RW - 28, h: 130, raio: 14 });
        cy += 142;
      }
      if (b.r.icone) {
        caixas += `<circle cx="${ramoX + RW / 2}" cy="${cy + 24}" r="25" fill="#ffffff"/>`;
        caixas += `<text x="${ramoX + RW / 2}" y="${cy + 37}" text-anchor="middle" font-size="32">${xml(b.r.icone)}</text>`;
        cy += 52;
      } else cy += 6;
      b.tl.forEach((t, j) => {
        caixas += `<text x="${ramoX + RW / 2}" y="${cy + LH_RAMO * (j + 0.78)}" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">${xml(t)}</text>`;
      });
      cy += b.tl.length * LH_RAMO;
      if (b.r.dado) {
        const py = cy + 12;
        caixas += `<rect x="${ramoX + 14}" y="${py}" width="${RW - 28}" height="78" rx="14" fill="#fff"/>`;
        let fs = 32;
        while (fs > 16 && quebrarLinhas(b.r.dado.valor.replace(/\s+/g, "\u00a0"), RW - 46, `900 ${fs}px`).length > 1) fs -= 2;
        caixas += `<text x="${ramoX + RW / 2}" y="${py + 30 + fs / 3}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${b.cor}">${xml(b.r.dado.valor)}</text>`;
        caixas += `<text x="${ramoX + RW / 2}" y="${py + 64}" text-anchor="middle" font-size="16" font-weight="700" fill="#6B6880">${xml(quebrarLinhas(b.r.dado.rotulo, RW - 50, "700 16px")[0] || "")}</text>`;
      }
      // itens
      const totalItens = b.itens.reduce((a, it) => a + it.h, 0) + Math.max(0, b.itens.length - 1) * GAP_ITEM;
      let iy = y + (b.h - totalItens) / 2;
      for (const it of b.itens) {
        const mY = iy + it.h / 2;
        const a0 = k === 1 ? ramoX + RW : ramoX, a1 = k === 1 ? itemX : itemX + IW;
        ligacoes += `<path d="M${a0},${ramoMY} C${(a0 + a1) / 2},${ramoMY} ${(a0 + a1) / 2},${mY} ${a1},${mY}" stroke="${b.cor}" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>`;
        caixas += `<rect x="${itemX}" y="${iy}" width="${IW}" height="${it.h}" rx="16" fill="${b.cor}1F" stroke="${b.cor}" stroke-width="2.5"/>`;
        let tx = itemX + 16;
        if (it.icone) {
          caixas += `<text x="${itemX + 30}" y="${mY + 10}" text-anchor="middle" font-size="26">${xml(it.icone)}</text>`;
          tx = itemX + 52;
        }
        const t0 = mY - (it.l.length * LH_ITEM) / 2;
        it.l.forEach((t, j) => {
          caixas += `<text x="${tx}" y="${t0 + LH_ITEM * (j + 0.78)}" font-size="22" font-weight="600" fill="#1D1B2C">${xml(t)}</text>`;
        });
        iy += it.h + GAP_ITEM;
      }
      y += b.h + GAP_BLOCO;
    }
  }

  // centro por cima das ligações
  const cy0 = CY - centroH / 2;
  let centro = `<rect x="${CX - CW / 2}" y="${cy0}" width="${CW}" height="${centroH}" rx="34" fill="#1D1B2C"/>`;
  if (fotoC) {
    centro += `<circle cx="${CX}" cy="${cy0 + 24 + 90}" r="96" fill="#fff"/>`;
    colar.push({ img: fotoC, x: CX - 90, y: cy0 + 24, w: 180, h: 180, circulo: true });
  } else if (mapa.icone) {
    centro += `<text x="${CX}" y="${cy0 + 72}" text-anchor="middle" font-size="54">${xml(mapa.icone)}</text>`;
  }
  centroL.forEach((t, j) => {
    centro += `<text x="${CX}" y="${cy0 + topoC + 44 * (j + 0.75)}" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">${xml(t)}</text>`;
  });

  // faixa do macete
  let macete = "";
  if (maceteH) {
    const my = TOPO + corpoH + 40;
    macete = `<rect x="${M}" y="${my}" width="${W - 2 * M}" height="${maceteH}" rx="24" fill="#EEEAFF" stroke="#5B3DF5" stroke-width="2.5" stroke-dasharray="10 8"/>
<text x="${M + 64}" y="${my + 62}" text-anchor="middle" font-size="44">🧠</text>
<text x="${M + 120}" y="${my + 36}" font-size="18" font-weight="800" fill="#5B3DF5" letter-spacing="1">MACETE PRA NÃO ESQUECER</text>` +
      maceteL.map((t, j) => `<text x="${M + 120}" y="${my + 72 + 36 * j}" font-size="26" font-weight="700" fill="#1D1B2C">${xml(t)}</text>`).join("");
  }

  svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${FONTE_SVG}">
<rect width="${W}" height="${H}" fill="#FFFFFF"/>
<text x="${M}" y="52" font-size="26" font-weight="800" fill="#5B3DF5">🗺️ Mapa mental</text>
${ligacoes}${caixas}${centro}${macete}
${temFoto ? `<text x="${M}" y="${H - 26}" font-size="17" font-weight="600" fill="#9A96AE">Fotos: Wikipédia / Wikimedia Commons</text>` : ""}
<text x="${W - M}" y="${H - 26}" text-anchor="end" font-size="20" font-weight="700" fill="#9A96AE">Feito com Estudaí</text>
</svg>`;
  return { svg, colar };
}

async function pngMapa(mapa) {
  const termos = [mapa.foto, ...mapa.ramos.map((r) => r.foto)].filter(Boolean).slice(0, 4);
  const fotos = {};
  await Promise.all(termos.map(async (t) => { const f = await buscarFoto(t); if (f) fotos[t] = f; }));
  const { svg, colar } = desenharMapa(mapa, fotos);
  const img = await new Promise((ok, erro) => {
    const i = new Image();
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
    i.onload = () => { URL.revokeObjectURL(url); ok(i); };
    i.onerror = () => { URL.revokeObjectURL(url); erro(new Error("Não consegui gerar a imagem.")); };
    i.src = url;
  });
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0);
  for (const f of colar) {
    const iw = f.img.width, ih = f.img.height;
    const esc = Math.max(f.w / iw, f.h / ih); // cobre o espaço, cortando as sobras
    const sw = f.w / esc, sh = f.h / esc;
    ctx.save();
    ctx.beginPath();
    if (f.circulo) ctx.arc(f.x + f.w / 2, f.y + f.h / 2, f.w / 2, 0, Math.PI * 2);
    else if (ctx.roundRect) ctx.roundRect(f.x, f.y, f.w, f.h, f.raio);
    else ctx.rect(f.x, f.y, f.w, f.h);
    ctx.clip();
    ctx.drawImage(f.img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, f.x, f.y, f.w, f.h);
    ctx.restore();
  }
  return await new Promise((ok, erro) => c.toBlob((b) => (b ? ok(b) : erro(new Error("Não consegui gerar a imagem."))), "image/png"));
}

function nomeArquivo(t) {
  return "mapa-" + String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + ".png";
}

async function rodarMapa(m, c) {
  if (!m.mapa) {
    c.innerHTML = `<div class="card" style="text-align:center">
        <div style="font-size:40px">🗺️</div>
        <p>Transforme o resumo num mapa mental em forma de imagem, pra revisar rapidinho ou mandar pros amigos.</p>
        <button class="botao primario" id="mCriar" ${m.resumo.length ? "" : "disabled"}>✨ Criar mapa mental</button>
      </div>`;
    const b = $("#mCriar"); if (!b) return;
    b.onclick = async () => {
      const parar = carregando("Desenhando seu mapa mental…");
      try {
        const r = await chamarIA({ modo: "mapa", titulo: m.titulo, texto: m.resumo.join("\n") });
        parar();
        const mapa = validarMapa(r.mapa, m.titulo);
        if (!mapa) { toast(r.erro || "Não consegui montar o mapa. Tente de novo.", 4000); return; }
        m.mapa = mapa;
      } catch (e) {
        parar();
        if (e.message !== "SEM_SERVIDOR") { toast(e.message, 4000); return; }
        m.mapa = mapaLocal(m); // modo prévia
      }
      salvar(); rodarMapa(m, c);
    };
    return;
  }
  m.mapa = validarMapa(m.mapa, m.titulo) || m.mapa; // normaliza mapas antigos
  c.innerHTML = `<div class="mapa-caixa" id="mapaCaixa"><div class="vazio">🎨 Buscando fotos e desenhando…</div></div>
    <p class="pequeno" style="text-align:center">Toque na imagem para ampliar.</p>
    <div class="linha">
      <button class="botao primario" id="mBaixar">⬇️ Baixar imagem</button>
      ${navigator.share ? `<button class="botao secundario" id="mShare">📤 Enviar</button>` : ""}
    </div>
    <div style="height:8px"></div>
    <button class="botao fantasma" id="mRefazer" style="font-size:14px">🔄 Fazer outro mapa</button>
    ${blocoCurtiu(m)}`;
  ligarCurtiu(m);
  let blob;
  try { blob = await pngMapa(m.mapa); }
  catch (e) { $("#mapaCaixa").innerHTML = `<div class="vazio">${esc(e.message)}</div>`; return; }
  if (!document.body.contains(c)) return;
  const url = URL.createObjectURL(blob);
  const caixa = $("#mapaCaixa");
  caixa.innerHTML = `<img src="${url}" alt="Mapa mental: ${esc(m.mapa.centro)}">`;
  caixa.onclick = () => caixa.classList.toggle("zoom");
  const arquivo = nomeArquivo(m.titulo);
  $("#mBaixar").onclick = () => {
    const a = document.createElement("a"); a.href = url; a.download = arquivo;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Imagem salva! Confira nos downloads ou na galeria.");
  };
  const sh = $("#mShare");
  if (sh) sh.onclick = async () => {
    const file = new File([blob], arquivo, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: m.titulo });
      else await navigator.share({ title: m.titulo, text: `Mapa mental: ${m.titulo}` });
    } catch (e) {}
  };
  $("#mRefazer").onclick = () => { m.mapa = null; salvar(); rodarMapa(m, c); };
}

    area = b.dataset.area; document.querySelectorAll("[data-area]").forEach((x) => x.classList.toggle("ativo", x === b));
  });
  $("#fbEnviar").onclick = async () => {
    const texto = $("#fbTexto").value.trim();
    if (!nota && !texto) { toast("Escolha uma carinha ou escreva algo 🙂"); return; }
    const item = { nota, area, texto, nome: $("#fbNome").value.trim(), contexto: op.contexto || "" };
    $("#fbEnviar").disabled = true;
    const ok = await enviarFeedback(item);
    fecharModal();
    toast(ok ? "Valeu pela opinião! 💜" : "Valeu! Vou enviar assim que tiver internet. 💜", 3200);
    if (op.voltar) op.voltar();
  };
}

async function enviarFeedback(item) {
  try {
    const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(item) });
    if (r.ok) return true;
    if (r.status === 400) return true; // pedido inválido: não adianta tentar de novo
  } catch (e) {}
  estado.feedbacksPendentes = [...(estado.feedbacksPendentes || []), item].slice(-20);
  salvar();
  return false;
}

async function reenviarFeedbacks() {
  const fila = estado.feedbacksPendentes || [];
  if (!fila.length || !navigator.onLine) return;
  estado.feedbacksPendentes = [];
  salvar();
  for (const item of fila) {
    try {
      const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(item) });
      if (!r.ok && r.status !== 400) throw new Error();
    } catch (e) {
      estado.feedbacksPendentes = [...(estado.feedbacksPendentes || []), item];
    }
  }
  salvar();
}

      <div id="qOpcoes">${ordem.map((i, k) => `<button class="opcao" data-op="${i}">${"ABCDEF"[k] || k + 1}) ${esc(q.opcoes[i])}</button>`).join("")}</div>
      <div id="qDepois"></div>`;
    document.querySelectorAll("[data-op]").forEach((b) => b.onclick = () => {
      const esc_ = +b.dataset.op, certo = esc_ === q.correta;

      $("#qDepois").innerHTML = `

      $("#qProx").onclick = () => { pos++; passo(); };
    });
  };
  passo();
}

/* ============================================================
   CRONOGRAMA — o aluno informa os horários e o app monta a semana
   ============================================================ */
const DIAS_SEM = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const CHAVE_DIA = { seg: 1, ter: 2, qua: 3, qui: 4, sex: 5, sab: 6 };
const BASE_MATERIAS = ["Matemática", "Português", "Ciências", "História", "Geografia", "Inglês"];
const toMin = (h) => { const [a, b] = String(h || "0:0").split(":").map(Number); return (a || 0) * 60 + (b || 0); };
const toHora = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const ehHora = (h) => /^\d{1,2}:\d{2}$/.test(h || "");
function diaDe(iso) { return new Date(iso + "T12:00:00").getDay(); }
function diasEntre(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000); }
function numDia(iso) { return Math.floor(Date.parse(iso + "T12:00:00Z") / 86400000); }

function rotinaPadrao() {
  const dias = {};
  for (let d = 0; d < 7; d++) dias[d] = { aula: d >= 1 && d <= 5, ini: "07:00", fim: "12:30", materias: [] };
  const materias = {};
  BASE_MATERIAS.forEach((m) => materias[m] = 2);
  return { dias, atividades: [], acordar: "06:30", dormir: "22:00", minutos: 60, fds: "leve", materias };
}

/* horários livres de um dia (em minutos desde 00:00) */
function subtrair(livres, a, b) {
  const r = [];
  for (const [x, y] of livres) {
    if (b <= x || a >= y) { r.push([x, y]); continue; }
    if (a > x) r.push([x, a]);
    if (b < y) r.push([b, y]);
  }
  return r;
}
function intervalosLivres(rot, dow) {
  const dia = rot.dias[dow] || {};
  const fimDeSemana = (dow === 0 || dow === 6) && !dia.aula;
  const inicio = Math.max(toMin(rot.acordar) + 45, fimDeSemana ? 9 * 60 + 30 : 8 * 60);
  let livres = [[inicio, toMin(rot.dormir) - 30]];
  if (dia.aula) livres = subtrair(livres, toMin(dia.ini) - 30, toMin(dia.fim) + 90); // ida, volta e almoço
  livres = subtrair(livres, 12 * 60, 13 * 60);          // almoço
  livres = subtrair(livres, 19 * 60 + 30, 20 * 60);     // jantar
  for (const at of rot.atividades.filter((a) => +a.dia === dow && ehHora(a.ini) && ehHora(a.fim))) {
    livres = subtrair(livres, toMin(at.ini) - 20, toMin(at.fim) + 20);
  }
  return livres.filter(([a, b]) => b - a >= 25);
}
function minutosAlvo(rot, dow) {
  const dia = rot.dias[dow] || {};
  if ((dow === 0 || dow === 6) && !dia.aula) {
    if (rot.fds === "livre") return 0;
    if (rot.fds === "leve") return Math.max(30, Math.round(rot.minutos / 2 / 15) * 15);
  }
  return rot.minutos;
}
function horariosDoDia(rot, dow) {
  const alvo = minutosAlvo(rot, dow);
  const L = alvo <= 45 ? alvo : alvo <= 60 ? 30 : 45, pausa = 10;
  const blocos = []; let total = 0;
  for (const [a, b] of intervalosLivres(rot, dow)) {
    let t = a;
    while (total < alvo && t + 20 <= b) {
      const dur = Math.min(L, alvo - total, b - t);
      if (dur < 20) break;
      blocos.push([t, t + dur]); total += dur; t += dur + pausa;
    }
    if (total >= alvo) break;
  }
  return { blocos, alvo, total };
}

/* o que estudar em cada bloco */
function listaMaterias(rot) {
  return Object.entries(rot.materias).filter(([, d]) => d > 0).sort((a, b) => a[0].localeCompare(b[0]));
}
function tarefasDoDia(rot, iso, n) {
  const dow = diaDe(iso);
  const fila = [];
  for (const t of estado.tarefas.filter((x) => !x.feito && x.data)) {
    const dist = diasEntre(iso, t.data);
    const mat = t.materia || t.titulo;
    if (t.tipo === "prova") {
      if (dist === 1) fila.push({ prio: 100, materia: mat, texto: `Simulado e revisão final · prova amanhã`, tarefaId: t.id });
      else if (dist === 2) fila.push({ prio: 92, materia: mat, texto: `Flashcards e exercícios · prova em 2 dias`, tarefaId: t.id });
      else if (dist === 3) fila.push({ prio: 88, materia: mat, texto: `Estudar o conteúdo e fazer o resumo · prova em 3 dias`, tarefaId: t.id });
      else if (dist === 5) fila.push({ prio: 60, materia: mat, texto: `Primeira leitura do conteúdo · prova em 5 dias`, tarefaId: t.id });
    } else if (t.tipo === "trabalho" || t.tipo === "apresentacao") {
      if (dist === 1) fila.push({ prio: 96, materia: mat, texto: t.tipo === "apresentacao" ? "Ensaiar a apresentação · é amanhã" : "Finalizar e revisar o trabalho · entrega amanhã", tarefaId: t.id });
      else if (dist >= 2 && dist <= 4) fila.push({ prio: 75, materia: mat, texto: `Avançar: ${t.titulo}`, tarefaId: t.id });
    } else if (dist === 1) {
      fila.push({ prio: 98, materia: mat, texto: `Fazer: ${t.titulo}`, tarefaId: t.id });
    }
  }
  const usadas = new Set(fila.map((f) => f.materia));
  // revisar a aula do dia (a matéria mais difícil que teve aula)
  const dia = rot.dias[dow] || {};
  if (dia.aula && dia.materias && dia.materias.length) {
    const aulas = [...new Set(dia.materias)].filter((m) => !usadas.has(m)).sort((a, b) => (rot.materias[b] || 2) - (rot.materias[a] || 2));
    if (aulas[0]) { fila.push({ prio: 70, materia: aulas[0], texto: "Revisar a aula de hoje e refazer exemplos" }); usadas.add(aulas[0]); }
  }
  // rodízio: matérias difíceis aparecem mais vezes
  const roda = [];
  for (const [m, d] of listaMaterias(rot)) for (let k = 0; k < d; k++) roda.push(m);
  if (roda.length) {
    let i = (numDia(iso) * 3) % roda.length, voltas = 0;
    while (fila.length < n && voltas < roda.length * 2) {
      const m = roda[i % roda.length]; i++; voltas++;
      if (usadas.has(m)) continue;
      usadas.add(m);
      const d = rot.materias[m];
      fila.push({ prio: 10, materia: m, texto: d >= 3 ? "Exercícios (matéria difícil, vá com calma)" : d === 1 ? "Revisão rápida do caderno" : "Revisar o caderno e fazer exercícios" });
    }
  }
  return fila.sort((a, b) => b.prio - a.prio).slice(0, n);
}

function montarSemana() {
  const rot = estado.rotina; if (!rot) return [];
  const dias = [];
  for (let k = 0; k < 7; k++) {
    const d = new Date(hojeISO() + "T12:00:00"); d.setDate(d.getDate() + k);
    const iso = d.toISOString().slice(0, 10);
    const { blocos, alvo } = horariosDoDia(rot, d.getDay());
    const tarefas = tarefasDoDia(rot, iso, blocos.length);
    dias.push({
      iso, dow: d.getDay(), alvo,
      blocos: blocos.slice(0, tarefas.length).map(([a, b], i) => ({ ...tarefas[i], ini: toHora(a), fim: toHora(b), chave: `${iso}|${tarefas[i].materia}|${tarefas[i].texto}` })),
      semHorario: alvo > 0 && blocos.length === 0,
    });
  }
  return dias;
}

/* ---------- tela ---------- */
function renderCronograma() {
  const alvo = $("#conteudoCrono");
  if (!estado.rotina) {
    alvo.innerHTML = `
      <div class="hero">
        <div class="titulo">Seu cronograma de estudos.</div>
        <p>Me conte seus horários de escola, atividades e sono. Eu monto sua semana de estudos e dou prioridade às provas da agenda.</p>
        <button class="botao" id="btnConfigCrono">⏰ Informar meus horários</button>
      </div>`;
    $("#btnConfigCrono").onclick = configurarRotina;
    return;
  }
  // limpa marcações antigas
  const limite = hojeISO();
  for (const k of Object.keys(estado.feitosCrono)) if (k.slice(0, 10) < limite) delete estado.feitosCrono[k];
  const semana = montarSemana();
  const hoje = semana[0];
  const feitosHoje = hoje.blocos.filter((b) => estado.feitosCrono[b.chave]).length;
  const totalSemana = semana.reduce((s, d) => s + d.blocos.length, 0);
  let html = `
    <div class="hero">
      <div class="titulo">${hoje.blocos.length ? (feitosHoje === hoje.blocos.length ? "Hoje tá feito! 🎉" : `Hoje: ${feitosHoje} de ${hoje.blocos.length} ${hoje.blocos.length === 1 ? "bloco" : "blocos"}`) : "Hoje é dia livre 😎"}</div>
      <p>${estado.rotina.minutos} min por dia · ${totalSemana} blocos nos próximos 7 dias. O plano se ajusta sozinho quando você salva provas na agenda.</p>
      <div class="linha">
        <button class="botao" id="btnEditarCrono">⚙️ Meus horários</button>
        <button class="botao claro" id="btnCalCrono">📅 Calendário</button>
      </div>
    </div>`;
  for (const d of semana) {
    const nome = d.iso === hojeISO() ? "Hoje" : diasEntre(hojeISO(), d.iso) === 1 ? "Amanhã" : DIAS_SEM[d.dow];
    const data = new Date(d.iso + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    html += `<h3>${nome} · ${data}</h3>`;
    if (!d.blocos.length) {
      html += `<div class="card pequeno">${d.semHorario ? "Sem horário livre neste dia. Confira suas atividades em ⚙️ Meus horários." : "Dia livre. Descanse! 🌴"}</div>`;
      continue;
    }
    html += `<div class="lista">${d.blocos.map((b) => {
      const feito = !!estado.feitosCrono[b.chave];
      const t = b.tarefaId && estado.tarefas.find((x) => x.id === b.tarefaId);

        </div></div>`;
    }).join("")}</div>`;
  }
  alvo.innerHTML = html;
  $("#btnEditarCrono").onclick = configurarRotina;
  $("#btnCalCrono").onclick = () => baixarSemanaCalendario(semana);
}
$("#conteudoCrono").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-cacao]"); if (!b) return;
  if (b.dataset.cacao === "feito") {
    const chave = b.closest("[data-chave]").dataset.chave;
    if (estado.feitosCrono[chave]) delete estado.feitosCrono[chave];
    else { estado.feitosCrono[chave] = true; toast("Bloco feito! 💪"); }
    salvar(); renderCronograma();
  }
  if (b.dataset.cacao === "estudar") {
    const t = estado.tarefas.find((x) => x.id === b.dataset.tarefa);
    if (t) estudarTarefa(t);
  }
});

let configurarRotinaReabrir = () => {};

function aplicarHorario(r, resp) {
  const dias = resp && resp.dias && typeof resp.dias === "object" ? resp.dias : {};
  let algum = false;
  for (const [k, v] of Object.entries(dias)) {
    const d = CHAVE_DIA[String(k).toLowerCase().slice(0, 3).replace("á", "a")];
    if (!d || !v) continue;
    algum = true;
    const mats = (Array.isArray(v.materias) ? v.materias : []).map(String).map((x) => x.trim()).filter(Boolean).slice(0, 12);
    r.dias[d] = { aula: true, ini: ehHora(v.inicio) ? v.inicio.padStart(5, "0") : r.dias[d].ini, fim: ehHora(v.fim) ? v.fim.padStart(5, "0") : r.dias[d].fim, materias: mats };
    for (const m of mats) if (!r.materias[m]) r.materias[m] = 2;
  }
  if (algum) for (let d = 1; d <= 6; d++) if (!Object.keys(dias).some((k) => CHAVE_DIA[String(k).toLowerCase().slice(0, 3).replace("á", "a")] === d)) r.dias[d].aula = false;
  return algum;
}

/* exporta a semana para o calendário do celular */
function baixarSemanaCalendario(semana) {
  const limpar = (s) => String(s || "").replace(/[\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const agora = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const linhas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Estudai//PT-BR", "CALSCALE:GREGORIAN"];
  let n = 0;
  for (const d of semana) for (const b of d.blocos) {
    const dt = d.iso.replace(/-/g, "");
    linhas.push("BEGIN:VEVENT", `UID:${dt}-${b.ini.replace(":", "")}-${n++}@estudai`, `DTSTAMP:${agora}`,
      `DTSTART:${dt}T${b.ini.replace(":", "")}00`, `DTEND:${dt}T${b.fim.replace(":", "")}00`,
      `SUMMARY:${limpar("📚 " + b.materia)}`, `DESCRIPTION:${limpar(b.texto)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${limpar("Hora de estudar " + b.materia)}`, "TRIGGER:-PT5M", "END:VALARM", "END:VEVENT");
  }
  if (!n) { toast("Não há blocos de estudo nos próximos dias."); return; }
  linhas.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([linhas.join("\r\n")], { type: "text/calendar;charset=utf-8" }));
  a.download = "cronograma-estudos.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`Abra o arquivo para pôr os ${n} blocos no calendário. Ele avisa 5 min antes de cada um.`, 4500);
}
