/* ---------- ⏱️ modo foco ---------- */
let focoTimer = null;
function abrirFoco(bloco = null) {
  const FOCO = 25 * 60, PAUSA = 5 * 60;
  let fase = "pronto", fim = 0, restante = FOCO, pausadoEm = null;
  const mats = [...new Set([...(estado.rotina ? Object.keys(estado.rotina.materias).filter((m) => !semEstudo(m)) : BASE_MATERIAS)])];
  let materia = bloco ? bloco.materia : (mats[0] || "");
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const parar = () => { clearInterval(focoTimer); focoTimer = null; };
  const desenhar = () => {
    const emPausa = fase === "pausa" || fase === "pausaRodando";
    const total = emPausa ? PAUSA : FOCO;
    const pct = Math.round(100 * (1 - restante / total));
    abrirModal(`
      <div class="topo"><b>${emPausa ? "Pausa ☕" : "Modo foco ⏱️"}</b><button class="fechar" id="fcFechar">✕</button></div>
      ${fase === "pronto" ? `
        <label class="campo">O que você vai estudar?</label>
        <select id="fcMat">${[...new Set([materia, ...mats])].filter(Boolean).map((m) => `<option ${m === materia ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
        ${bloco ? `<p class="pequeno">${esc(bloco.texto)}</p>` : ""}
        <p class="pequeno">Deixe o celular de lado, sem redes sociais. Quando o tempo acabar, eu aviso.</p>` : `<div class="pequeno" style="text-align:center">${iconeMateria(materia)} ${esc(materia)}</div>`}
      <div style="position:relative;width:220px;height:220px;margin:16px auto">
        <svg viewBox="0 0 100 100" style="width:100%;height:100%;transform:rotate(-90deg)">
          <circle cx="50" cy="50" r="44" fill="none" stroke="var(--roxo-claro)" stroke-width="8"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="${emPausa ? "#12b886" : "var(--roxo)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2 * Math.PI * 44}" stroke-dashoffset="${2 * Math.PI * 44 * (1 - pct / 100)}"/>
        </svg>
        <div id="fcTempo" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums">${mmss(restante)}</div>
      </div>
      ${fase === "pronto" ? `<button class="botao primario" id="fcIr">▶️ Começar 25 min</button>` : ""}
      ${fase === "rodando" || fase === "pausaRodando" ? `<button class="botao secundario" id="fcPausar">⏸️ Pausar</button>` : ""}
      ${fase === "parado" ? `<button class="botao primario" id="fcVoltar">▶️ Continuar</button>` : ""}
      ${fase === "pausa" ? `<p style="text-align:center">🎉 Mandou bem! Levanta, bebe água e estica o corpo.</p><button class="botao primario" id="fcPausaIr">☕ Começar pausa de 5 min</button><div style="height:8px"></div><button class="botao secundario" id="fcDeNovo">⏱️ Mais 25 min de foco</button>` : ""}
      ${fase === "acabou" ? `<p style="text-align:center">Pausa acabou! Quer mais uma rodada?</p><button class="botao primario" id="fcDeNovo">⏱️ Mais 25 min de foco</button>` : ""}`);
    $("#fcFechar").onclick = () => { if ((fase === "rodando" || fase === "parado") && !confirm("Parar o foco agora? Esta sessão não vai contar.")) return; parar(); fecharModal(); };
    if ($("#fcMat")) $("#fcMat").onchange = (e) => materia = e.target.value;
    if ($("#fcIr")) $("#fcIr").onclick = () => iniciar("rodando", FOCO);
    if ($("#fcPausar")) $("#fcPausar").onclick = () => { parar(); pausadoEm = fase; fase = "parado"; desenhar(); };
    if ($("#fcVoltar")) $("#fcVoltar").onclick = () => iniciar(pausadoEm || "rodando", restante);
    if ($("#fcPausaIr")) $("#fcPausaIr").onclick = () => iniciar("pausaRodando", PAUSA);
    if ($("#fcDeNovo")) $("#fcDeNovo").onclick = () => iniciar("rodando", FOCO);
  };
  const avisar = (titulo, corpo) => {
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    if ("Notification" in window && Notification.permission === "granted" && navigator.serviceWorker) {
      navigator.serviceWorker.ready.then((r) => r.showNotification(titulo, { body: corpo, icon: "/icon-192.png", tag: "estudai-foco" })).catch(() => {});
    }
  };
  const iniciar = (novaFase, segundos) => {
    parar(); fase = novaFase; restante = segundos; fim = Date.now() + segundos * 1000; desenhar();
    focoTimer = setInterval(() => {
      restante = Math.max(0, Math.round((fim - Date.now()) / 1000));
      const el = $("#fcTempo"); if (!el) { parar(); return; }
      if (restante > 0) { el.textContent = mmss(restante); const arco = document.querySelectorAll("#camadaModal circle")[1]; if (arco) arco.setAttribute("stroke-dashoffset", String(2 * Math.PI * 44 * (restante / (fase === "pausaRodando" ? PAUSA : FOCO)))); return; }
      parar();
      if (fase === "rodando") {
        contar("focos"); contar("minutosFoco", 25);
        if (bloco && bloco.chave) estado.feitosCrono[bloco.chave] = true;
        salvar(); registrarUso("foco", materia);
        avisar("⏱️ 25 minutos de foco! 🎉", "Hora de uma pausa de 5 minutos.");
        fase = "pausa"; restante = PAUSA;
      } else { avisar("☕ Pausa acabou", "Bora mais uma rodada?"); fase = "acabou"; restante = FOCO; }
      desenhar();
    }, 1000);
  };
  desenhar();
}

/* ---------- 📒 minhas notas ---------- */
function confNotas() {
  if (!estado.notas || typeof estado.notas !== "object") estado.notas = {};
  const n = estado.notas;
  const padrao = { media: 6, periodos: 4, nomePer: "", ano: new Date().getFullYear(), serie: "", materias: {}, extras: {}, anteriores: {} };
  for (const [k, v] of Object.entries(padrao)) if (n[k] == null) n[k] = v;
  if (!n.anteriores || typeof n.anteriores !== "object") n.anteriores = {};
  if (!NOMES_PER[n.nomePer]) n.nomePer = n.periodos === 3 ? "trimestre" : "bimestre";
  const base = estado.rotina ? Object.keys(estado.rotina.materias).filter((m) => !semEstudo(m)) : BASE_MATERIAS;
  for (const m of base) if (!n.materias[m]) n.materias[m] = [];
  return n;
}
const NOMES_PER = { bimestre: "B", trimestre: "T", unidade: "U", etapa: "E" };
function anoValido(v) { const x = parseInt(v, 10); const agora = new Date().getFullYear(); return x >= 2000 && x <= agora + 1 ? x : null; }
function notaIA(v) { const x = parseFloat(String(v ?? "").replace(",", ".")); if (!Number.isFinite(x)) return null; return numNota(x > 10 && x <= 100 ? x / 10 : x); }
function temNotas(mats, extras) { return Object.values(mats || {}).some((l) => (l || []).some((v) => numNota(v) != null)) || Object.values(extras || {}).some((e) => e && (numNota(e.anual) != null || numNota(e.final) != null)); }
function numNota(v) { const x = parseFloat(String(v).replace(",", ".")); return Number.isFinite(x) && x >= 0 && x <= 10 ? x : null; }
function fmt1(x) { return x.toFixed(1).replace(".", ","); }
// Situação da matéria no ano: usa a nota final (recuperação) e a média anual do boletim, se houver
function situacaoNota(lista, media, periodos, extra) {
  extra = extra || {};
  const vals = (lista || []).slice(0, periodos).map(numNota);
  const feitas = vals.filter((v) => v != null);
  const anual = numNota(extra.anual), final = numNota(extra.final);
  const soma = feitas.reduce((a, b) => a + b, 0);
  const calc = feitas.length ? soma / feitas.length : null;
  const mostrada = anual != null ? anual : calc;
  if (final != null) return final >= media
    ? { media: mostrada, final, txt: `✅ Aprovado na final (${fmt1(final)})`, cor: "#087f5b" }
    : { media: mostrada, final, txt: `⚠️ Final ${fmt1(final)}, abaixo de ${fmt1(media)}. Fale com a escola.`, cor: "var(--vermelho)" };
  if (anual != null && (feitas.length === periodos || !feitas.length)) return anual >= media
    ? { media: anual, txt: "✅ Aprovado no ano", cor: "#087f5b" }
    : { media: anual, txt: "⚠️ Média do ano abaixo: veja a recuperação final", cor: "var(--vermelho)" };
  if (!feitas.length) return { media: null, txt: "Sem notas ainda", cor: "var(--suave)" };
  const faltam = periodos - feitas.length;
  if (!faltam) return calc >= media ? { media: calc, txt: "✅ Aprovado no ano", cor: "#087f5b" } : { media: calc, txt: "⚠️ Média do ano abaixo: fale com o professor sobre a recuperação", cor: "var(--vermelho)" };
  const precisa = (media * periodos - soma) / faltam;
  if (precisa <= 0) return { media: mostrada, txt: "✅ Já garantiu a média!", cor: "#087f5b" };
  if (precisa > 10) return { media: mostrada, txt: `⚠️ Precisaria de mais de 10 em cada ${faltam === 1 ? "período" : "um dos " + faltam + " períodos"} que faltam. Peça ajuda e veja a recuperação.`, cor: "var(--vermelho)" };
  return { media: mostrada, txt: `🎯 Precisa de ${fmt1(precisa)} ${faltam === 1 ? "no próximo período" : `em cada um dos ${faltam} períodos que faltam`}`, cor: precisa >= 8 ? "#b35c00" : "var(--roxo)" };
}
// Tabela do boletim do ano inteiro + média geral
function tabelaBoletim(d, rot) {
  const per = d.periodos || 4, media = d.media || 6, ex = d.extras || {};
  const ms = Object.keys(d.materias || {}).filter((m) => (d.materias[m] || []).some((x) => numNota(x) != null) || numNota((ex[m] || {}).anual) != null || numNota((ex[m] || {}).final) != null);
  if (!ms.length) return "";
  const linhas = ms.map((m) => ({ m, s: situacaoNota(d.materias[m], media, per, ex[m]), notas: (d.materias[m] || []).slice(0, per) }));
  const comMedia = linhas.filter((l) => l.s.media != null);
  const geral = comMedia.length ? comMedia.reduce((a, l) => a + (l.s.final != null ? Math.max(l.s.final, l.s.media) : l.s.media), 0) / comMedia.length : null;
  const acima = comMedia.filter((l) => (l.s.final != null ? l.s.final : l.s.media) >= media).length;
  const cel = "padding:5px 2px;text-align:center;border-top:1px solid var(--linha,#e6e3f0)";
  const cor = (v) => { const x = numNota(v); return x == null ? "var(--suave)" : x >= media ? "inherit" : "var(--vermelho)"; };
  return `<div class="card" style="margin-top:10px;padding:12px">
    <b>📊 Boletim ${d.ano || ""}${d.serie ? " · " + esc(d.serie) : ""}</b>
    <div style="overflow-x:auto;margin-top:6px"><table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <tr style="color:var(--suave)"><th style="text-align:left;padding:4px 2px">Matéria</th>${Array.from({ length: per }, (_, i) => `<th>${rot}${i + 1}</th>`).join("")}<th>Média</th><th>Final</th></tr>
      ${linhas.map((l) => `<tr><td style="${cel};text-align:left;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${iconeMateria(l.m)} ${esc(l.m)}</td>
        ${Array.from({ length: per }, (_, i) => `<td style="${cel};color:${cor(l.notas[i])}">${numNota(l.notas[i]) != null ? fmt1(numNota(l.notas[i])) : "–"}</td>`).join("")}
        <td style="${cel};font-weight:800;color:${l.s.media != null && l.s.media < media ? "var(--vermelho)" : "var(--roxo)"}">${l.s.media != null ? fmt1(l.s.media) : "–"}</td>
        <td style="${cel};color:${cor(l.s.final)}">${l.s.final != null ? fmt1(l.s.final) : "–"}</td></tr>`).join("")}
    </table></div>
    ${geral != null ? `<div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:800"><span>Média geral do ano</span><span style="color:${geral >= media ? "#087f5b" : "var(--vermelho)"}">${fmt1(geral)}</span></div>
    <div class="pequeno">✅ ${acima} de ${comMedia.length} ${comMedia.length === 1 ? "matéria" : "matérias"} na média${comMedia.length - acima ? ` · ⚠️ ${comMedia.length - acima} abaixo` : ""}</div>` : ""}
  </div>`;
}

    ${Object.keys(n.materias).map((m) => {

        </div>

      </div>`;
    }).join("")}
    <div class="linha" style="margin-top:10px"><input id="ntNova" placeholder="Outra matéria (ex.: Espanhol)" maxlength="30"><button class="mini roxo" id="ntAdd" style="flex:0 0 auto">＋ Adicionar</button></div>

          <button class="mini" data-apagaano="${a}" style="margin-top:6px">🗑️ Apagar ${a}</button>`; }).join("")}` : ""}

  $("#ntMedia").onchange = (e) => { n.media = +e.target.value; salvar(); abrirNotas(); };

      } catch (e) {

}

// Guarda o ano atual em "anteriores" e abre outro ano (trazendo de volta se já existia)
function trocarAnoNotas(n, novo) {
  if (temNotas(n.materias, n.extras) || n.serie) n.anteriores[n.ano] = { serie: n.serie, media: n.media, periodos: n.periodos, nomePer: n.nomePer, materias: n.materias, extras: n.extras };
  const volta = n.anteriores[novo];
  delete n.anteriores[novo];
  n.ano = novo;
  if (volta) Object.assign(n, { serie: volta.serie || "", media: volta.media || n.media, periodos: volta.periodos || n.periodos, nomePer: volta.nomePer || n.nomePer, materias: volta.materias || {}, extras: volta.extras || {} });
  else { n.serie = ""; n.materias = {}; n.extras = {}; confNotas(); }
}

// Mostra o que a IA leu do boletim para o aluno conferir antes de salvar
function conferirBoletim(r) {
  r = limparTudo(r || {});
  const per = r.periodos === 3 ? 3 : 4;
  const nomeLido = String(r.nome_periodo || "").toLowerCase();
  const nomePer = NOMES_PER[nomeLido] ? nomeLido : (per === 3 ? "trimestre" : "bimestre");
  const lidas = (Array.isArray(r.materias) ? r.materias : []).filter((m) => m && m.materia)
    .map((m) => { const f = (x) => { const v = notaIA(x); return v == null ? "" : fmt1(v); };
      return { materia: String(m.materia).slice(0, 30), notas: Array.from({ length: per }, (_, i) => f((m.notas || [])[i])), anual: f(m.media_anual), final: f(m.final) }; })
    .filter((m) => m.notas.some(Boolean) || m.anual || m.final).slice(0, 20);
  if (!lidas.length) { toast(r.aviso || "Não consegui ler o boletim. Tente uma foto reta, de perto e com boa luz.", 4500); return; }
  const n = confNotas();
  const anoLido = anoValido(r.ano);
  const agora = new Date().getFullYear();
  const anoBol = anoLido || n.ano || agora;
  const anos = [...new Set([agora + 1, agora, agora - 1, agora - 2, anoBol, n.ano])].filter(Boolean).sort((a, b) => b - a);
  const rot = NOMES_PER[nomePer];
  abrirModal(`
    <div class="topo"><b>Confira as notas 📒</b><button class="fechar" data-fechar>✕</button></div>
    <p class="pequeno" style="margin-top:0">Foi isso que eu li do boletim. Corrija o que estiver errado antes de salvar.</p>
    <div class="linha">
      <div><label class="campo" style="margin-top:0">📅 Ano letivo</label>
        <select id="bolAno">${anos.map((a) => `<option value="${a}" ${a === anoBol ? "selected" : ""}>${a}</option>`).join("")}</select></div>
      <div><label class="campo" style="margin-top:0">🎒 Série</label>
        <input id="bolSerie" maxlength="20" value="${esc(String(r.serie || (anoBol === n.ano ? n.serie : "") || "").slice(0, 20))}" placeholder="Ex.: 8º ano"></div>
    </div>
    ${anoLido ? "" : `<p class="pequeno" style="color:#b35c00">⚠️ Não achei o ano no boletim. Confira se ${anoBol} está certo.</p>`}
    <p class="pequeno">Dividido em ${per} ${nomePer}s.</p>
    ${lidas.map((m, k) => `<div class="card" style="margin-top:8px"><b>${iconeMateria(m.materia)} ${esc(m.materia)}</b>
      <div style="display:grid;grid-template-columns:repeat(${per + 2},1fr);gap:5px;margin-top:6px">
        ${m.notas.map((v, i) => `<input inputmode="decimal" placeholder="${rot}${i + 1}" data-bol="${k}|${i}" value="${esc(v)}" style="text-align:center;padding:8px 2px;min-width:0;width:100%;box-sizing:border-box">`).join("")}
        ${["anual", "final"].map((x) => `<input inputmode="decimal" placeholder="${x === "anual" ? "Méd" : "Final"}" data-bolx="${k}|${x}" value="${esc(m[x])}" style="text-align:center;padding:8px 2px;min-width:0;width:100%;box-sizing:border-box;background:var(--fundo2,#f3f0ff)">`).join("")}
      </div></div>`).join("")}
    <p class="pequeno">"Méd" = média do ano e "Final" = recuperação/prova final, quando o boletim mostra.</p>
    <div style="height:12px"></div>
    <button class="botao primario" id="bolSalvar">Salvar notas</button>`);
  $("#bolSalvar").onclick = () => {
    document.querySelectorAll("[data-bol]").forEach((inp) => { const [k, i] = inp.dataset.bol.split("|").map(Number); const v = numNota(inp.value.trim()); lidas[k].notas[i] = v == null ? "" : fmt1(v); });
    document.querySelectorAll("[data-bolx]").forEach((inp) => { const [k, x] = inp.dataset.bolx.split("|"); const v = numNota(inp.value.trim()); lidas[+k][x] = v == null ? "" : fmt1(v); });
    const ano = +$("#bolAno").value;
    const serie = $("#bolSerie").value.trim().slice(0, 20);
    let msg = "";
    if (ano !== n.ano) {
      if (ano < n.ano && temNotas(n.materias, n.extras)) {
        // boletim de um ano que já passou: guarda em "Anos anteriores" sem mexer no ano atual
        const antes = n.anteriores[ano] || { materias: {} };
        const mats = { ...(antes.materias || {}) }, exs = { ...(antes.extras || {}) };
        for (const m of lidas) { mats[m.materia] = m.notas; exs[m.materia] = { anual: m.anual, final: m.final }; }
        n.anteriores[ano] = { serie: serie || antes.serie || "", media: [5, 6, 7].includes(Math.round(Number(r.media))) ? Math.round(Number(r.media)) : (antes.media || n.media), periodos: per, nomePer, materias: mats, extras: exs };
        salvar(); toast(`📚 Notas de ${ano} guardadas em "Anos anteriores"`, 4000); abrirNotas(); return;
      }
      trocarAnoNotas(n, ano);
      msg = ` · ano letivo ${ano}`;
    }
    n.periodos = per; n.nomePer = nomePer;
    if (serie) n.serie = serie;
    if ([5, 6, 7].includes(Math.round(Number(r.media)))) n.media = Math.round(Number(r.media));
    for (const m of lidas) { n.materias[m.materia] = m.notas; n.extras[m.materia] = { anual: m.anual, final: m.final }; }
    salvar(); toast(`📒 Notas de ${lidas.length} ${lidas.length === 1 ? "matéria salvas" : "matérias salvas"}${msg}`); abrirNotas();
  };
}

/* ---------- ✍️ corrigir redação ---------- */
let fotosRedacao = [];
function abrirRedacao() {
  fotosRedacao = [];
  let tipo = (estado.redacao && estado.redacao.tipo) || "enem";
  const desenhar = (tema = "", texto = "") => {
    abrirModal(`
      <div class="topo"><b>Corrigir redação ✍️</b><button class="fechar" data-fechar>✕</button></div>
      <div class="abas" style="margin-top:0">
        <button data-tipo="enem" class="${tipo === "enem" ? "ativo" : ""}">ENEM (0–1000)</button>
        <button data-tipo="escola" class="${tipo === "escola" ? "ativo" : ""}">Escola (0–10)</button>
      </div>

      <input id="rdTema" maxlength="300" value="${esc(tema)}" placeholder="Ex.: Desafios da educação digital no Brasil">

// 2) corrige a partir do texto (digitado ou conferido pelo aluno)
async function corrigirTexto(tipo, tema, texto) {
  const parar = carregando("📖 Lendo sua redação…",

      : ["✏️ Competência 1: norma padrão…", "🧭 Competência 2: tema e repertório…", "🧱 Competência 3: argumentos…", "🔗 Competência 4: coesão…", "🛠️ Competência 5: proposta de intervenção…", "✨ Separando as dicas…", "Quase lá…"]);
  try {
    const r = await chamarIA({ modo: "redacao", tipo, tema, texto });

}

/* ---------- ✍️ conferir a leitura da letra e aprender com as correções ---------- */
function paresLetra() {
  const p = (estado.letra && Array.isArray(estado.letra.pares)) ? estado.letra.pares : [];
  return [...p].sort((a, b) => (b.n || 1) - (a.n || 1));
}
const semAcento = (w) => w.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function palavrasTexto(t) { return (String(t).match(/[A-Za-zÀ-ÿ]+(?:[-'][A-Za-zÀ-ÿ]+)*/g) || []); }
function parecidas(a, b) {
  a = semAcento(a); b = semAcento(b);
  if (a === b) return true; // só acento: também é leitura
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return false;
  const d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n] <= Math.max(2, Math.ceil(Math.max(m, n) * 0.5));
}
// Compara o que a IA leu com o que o aluno corrigiu e guarda as trocas de palavra
function aprenderLetra(lido, certo) {
  const A = palavrasTexto(lido).slice(0, 900), B = palavrasTexto(certo).slice(0, 900);
  const m = A.length, n = B.length;
  if (!m || !n) return 0;
  const L = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const trocas = []; let i = 0, j = 0, ga = [], gb = [];
  const fecha = () => { if (ga.length && ga.length === gb.length && ga.length <= 3) ga.forEach((w, k) => { if (w.length >= 2 && parecidas(w, gb[k])) trocas.push([w, gb[k]]); }); ga = []; gb = []; };
  while (i < m && j < n) {
    if (A[i] === B[j]) { fecha(); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) ga.push(A[i++]);
    else gb.push(B[j++]);
  }
  while (i < m) ga.push(A[i++]); while (j < n) gb.push(B[j++]); fecha();
  if (!trocas.length) return 0;
  estado.letra = estado.letra || { pares: [] };
  const pares = estado.letra.pares = estado.letra.pares || [];
  for (const [l, c] of trocas) {
    const x = pares.find((p) => p.l === l && p.c === c);
    if (x) x.n = (x.n || 1) + 1; else pares.push({ l, c, n: 1 });
  }
  estado.letra.pares = paresLetra().slice(0, 60);
  salvarLocal();
  return trocas.length;
}
function conferirLeitura({ tipo, tema, lido, duvidas, legib, voltar }) {

}

function validarRedacao(r, tipo) {
  r = limparTudo(r || {});
  const enem = (r.escala || tipo) !== "escola";
  const max = enem ? 200 : 2;
  const comps = (Array.isArray(r.competencias) ? r.competencias : []).slice(0, 5).map((c, i) => ({
    n: i + 1, nome: String(c.nome || `Competência ${i + 1}`).slice(0, 120),
    nota: Math.max(0, Math.min(max, Number(c.nota) || 0)),
    comentario: String(c.comentario || "").slice(0, 500), como_melhorar: String(c.como_melhorar || "").slice(0, 400),
  }));
  if (!comps.length) return null;
  const total = comps.reduce((a, c) => a + c.nota, 0);
  return {
    enem, tema: String(r.tema || "").slice(0, 200), total, max: max * comps.length, comps,
    fortes: (Array.isArray(r.pontos_fortes) ? r.pontos_fortes : []).map(String).filter(Boolean).slice(0, 4),
    erros: (Array.isArray(r.erros) ? r.erros : []).filter((e) => e && e.trecho).map((e) => ({ trecho: String(e.trecho).slice(0, 160), correcao: String(e.correcao || "").slice(0, 160) })).slice(0, 6),
    reescrita: r.reescrita && r.reescrita.depois ? { antes: String(r.reescrita.antes || "").slice(0, 500), depois: String(r.reescrita.depois).slice(0, 600) } : null,
    aviso: String(r.aviso || "").slice(0, 300),
  };
}

/* ---------- 🎒 mochila de amanhã ---------- */
function itensMochila() {
  const am = new Date(hojeISO() + "T12:00:00"); am.setDate(am.getDate() + 1);
  const iso = am.toISOString().slice(0, 10), dow = am.getDay();
  const dia = estado.rotina && estado.rotina.dias[dow];
  const materias = dia && dia.aula ? [...new Set(dia.materias || [])] : [];
  const entregas = estado.tarefas.filter((t) => !t.feito && t.data === iso);
  const itens = [
    ...materias.map((m) => ({ id: `mat:${m}`, txt: semEstudo(m) && /f[ií]sica/i.test(m) ? `${iconeMateria(m)} ${m}: roupa e tênis` : `${iconeMateria(m)} ${m}: caderno e livro` })),
    ...entregas.map((t) => ({ id: `tar:${t.id}`, txt: `${t.tipo === "prova" ? "📝 Prova" : t.tipo === "trabalho" ? "📎 Entregar trabalho" : t.tipo === "apresentacao" ? "🎤 Apresentação" : "📌 " + (TIPOS[t.tipo] || "Atividade")}: ${t.titulo}${t.detalhes ? ` (${t.detalhes})` : ""}` })),
    ...(entregas.some((t) => t.tipo === "prova") ? [{ id: "x:prova", txt: "✏️ Lápis, borracha, caneta e calculadora (se pode)" }] : []),
    { id: "x:agua", txt: "💧 Garrafinha de água e lanche" },
  ];
  return { iso, dow, itens, temAula: !!(dia && dia.aula), semRotina: !estado.rotina };
}
function abrirMochila() {
  const { iso, dow, itens, temAula, semRotina } = itensMochila();
  estado.mochila = estado.mochila || {};
  for (const k of Object.keys(estado.mochila)) if (k < hojeISO()) delete estado.mochila[k];
  const marcados = new Set(estado.mochila[iso] || []);
  abrirModal(`
    <div class="topo"><b>Mochila de amanhã 🎒</b><button class="fechar" data-fechar>✕</button></div>
    <div class="pequeno">${DIAS_SEM[dow]}, ${iso.split("-").reverse().slice(0, 2).join("/")}</div>
    ${semRotina ? `<div class="aviso" style="margin-top:8px">Monte seu cronograma (com as matérias de cada dia) para eu saber o que vai ter amanhã.</div>` : !temAula ? `<div class="aviso" style="margin-top:8px">Amanhã não tem aula no seu horário. 🌴</div>` : ""}
    <div class="lista" style="margin-top:10px">
      ${itens.map((it) => `<button class="card tarefa ${marcados.has(it.id) ? "feita" : ""}" data-moch="${esc(it.id)}" style="width:100%;text-align:left">
        <span class="check ${marcados.has(it.id) ? "on" : ""}">${marcados.has(it.id) ? "✓" : ""}</span><div class="corpo"><div class="t" style="font-weight:600">${esc(it.txt)}</div></div></button>`).join("")}
    </div>
    ${itens.length && marcados.size >= itens.length ? `<p style="text-align:center;margin-top:12px">🎒 Mochila pronta! Boa noite de sono 😴</p>` : ""}`);
  document.querySelectorAll("[data-moch]").forEach((b) => b.onclick = () => {
    const id = b.dataset.moch;
    if (marcados.has(id)) marcados.delete(id); else marcados.add(id);
    estado.mochila[iso] = [...marcados]; salvarLocal(); abrirMochila();
  });
}

/* ============================================================
   🔊 OUVIR (voz do próprio celular, grátis e sem internet)
   ============================================================ */
let vozBotao = null;
function vozSuportada() { return "speechSynthesis" in window && "SpeechSynthesisUtterance" in window; }
function pararVoz() {
  try { if (vozSuportada()) speechSynthesis.cancel(); } catch (e) {}
  if (vozBotao) { vozBotao.textContent = vozBotao.dataset.rotulo; vozBotao = null; }
}
function alternarVoz(textos, botao, rotulo) {
  if (!vozSuportada()) { toast("Este navegador não tem leitura em voz alta. Tente pelo Safari."); return; }
  if (vozBotao === botao) { pararVoz(); return; }
  pararVoz();
  const vozes = speechSynthesis.getVoices();
  const voz = vozes.find((v) => /pt[-_]BR/i.test(v.lang)) || vozes.find((v) => /^pt/i.test(v.lang));
  const partes = textos.map((t) => String(t || "").trim()).filter(Boolean);
  if (!partes.length) return;
  botao.dataset.rotulo = rotulo; botao.textContent = "⏹️ Parar"; vozBotao = botao;
  partes.forEach((t, i) => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "pt-BR"; if (voz) u.voice = voz; u.rate = 1;
    if (i === partes.length - 1) u.onend = () => { if (vozBotao === botao) pararVoz(); };
    speechSynthesis.speak(u);
  });
  registrarUso("ouvir");
}

/* ============================================================
   🧠 REVISÃO DO DIA — repetição espaçada (caixas de Leitner)
   Cartão certo vai para a próxima caixa e volta depois de 1, 3, 7, 14 ou 30 dias.
   Cartão errado volta para a caixa 1 e aparece amanhã.
   ============================================================ */
const CAIXAS_DIAS = [0, 1, 3, 7, 14, 30];
const NOVOS_POR_DIA = 10, MAX_REVISAO = 25;
function filaRevisao() {
  const srs = estado.srs || {}, hoje = hojeISO();
  const vencidos = [], novos = [];
  for (const m of estado.materiais) {
    if (m.banco || !m.flashcards || !m.flashcards.length) continue;
    m.flashcards.forEach((_, i) => {
      const k = m.id + ":" + i, s = srs[k];
      if (s) { if (s.p <= hoje) vencidos.push({ m, i, k, c: s.c }); }
      else if ((m.erros || []).includes(i)) vencidos.push({ m, i, k, c: 0 });
      else if (m.cardsFeitos) novos.push({ m, i, k, c: 0 });
    });
  }
  vencidos.sort((a, b) => a.c - b.c);
  const jaNovosHoje = ((estado.diario || {})[hoje] || {}).novosSrs || 0;
  const lista = [...vencidos.slice(0, MAX_REVISAO), ...novos.slice(0, Math.max(0, Math.min(NOVOS_POR_DIA - jaNovosHoje, MAX_REVISAO - vencidos.length)))];
  return { lista, total: lista.length };
}
function marcarRevisao(item, sabia) {
  estado.srs = estado.srs || {};
  const novo = !estado.srs[item.k];
  const c = sabia ? Math.min(5, (estado.srs[item.k] ? estado.srs[item.k].c : 0) + 1) : 1;
  estado.srs[item.k] = { c, p: somaDias(sabia ? CAIXAS_DIAS[c] : 1) };
  if (novo) contar("novosSrs");
  const m = item.m;
  if (sabia) m.erros = (m.erros || []).filter((x) => x !== item.i);
  else m.erros = [...new Set([...(m.erros || []), item.i])];
}
function abrirRevisao() {
  const { lista } = filaRevisao();
  if (!lista.length) {
    const tem = estado.materiais.some((m) => !m.banco && m.flashcards.length);
    abrirModal(`<div class="topo"><b>Revisão do dia 🧠</b><button class="fechar" data-fechar>✕</button></div>
      <div class="card placar"><div class="n">${tem ? "✓" : "🃏"}</div><p>${tem ? "Tudo revisado por hoje! Volte amanhã: os cartões aparecem no dia certo para você não esquecer." : "Crie um material do caderno e faça os flashcards uma vez. Depois eles aparecem aqui no tempo certo."}</p></div>
      <div style="height:12px"></div><button class="botao secundario" data-fechar>Fechar</button>`);
    return;
  }
  for (let i = lista.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lista[i], lista[j]] = [lista[j], lista[i]]; }
  let pos = 0, certos = 0;
  abrirModal(`<div class="topo"><b>Revisão do dia 🧠</b><button class="fechar" data-fechar>✕</button></div><div id="rvArea"></div>`);
  const c = $("#rvArea");
  const passo = () => {
    if (pos >= lista.length) {
      contar("revisoes"); salvar(); registrarUso("revisao", `${certos}/${lista.length}`);
      const amanha = Object.values(estado.srs || {}).filter((s) => s.p === somaDias(1)).length;
      c.innerHTML = `<div class="card placar"><div class="n">${certos}/${lista.length}</div>
        <p>${certos === lista.length ? "Lembrou de tudo! 🎉" : "Os que você errou voltam amanhã. É assim que a memória fixa 💪"}</p>
        <p class="pequeno">${amanha ? `Amanhã: ${amanha} ${amanha === 1 ? "cartão" : "cartões"}.` : ""} Cada acerto faz o cartão voltar mais tarde: 1, 3, 7, 14 e 30 dias.</p></div>
        <div style="height:12px"></div><button class="botao primario" data-fechar>Fechar</button>`;
      return;
    }
    const it = lista[pos], card = it.m.flashcards[it.i];
    c.innerHTML = `
      <div class="pequeno">${iconeMateria(it.m.materia)} ${esc(it.m.titulo)} · ${pos + 1} de ${lista.length}</div>
      <div class="progresso"><div style="width:${(pos / lista.length) * 100}%"></div></div>
      <div class="flash" id="flash"><div class="in">
        <div class="lado frente">${esc(card.frente)}<small>toque para virar</small></div>
        <div class="lado verso">${esc(card.verso)}</div>
      </div></div>
      <div class="linha" id="fBotoes" style="visibility:hidden">
        <button class="botao" style="background:var(--vermelho-claro);color:var(--vermelho)" id="fErrei">😕 Esqueci</button>
        <button class="botao" style="background:var(--verde-claro);color:#087f5b" id="fSabia">😎 Lembrei</button>
      </div>`;
    $("#flash").onclick = () => { $("#flash").classList.toggle("virado"); $("#fBotoes").style.visibility = "visible"; };
    $("#fErrei").onclick = () => { marcarRevisao(it, false); salvarLocal(); pos++; passo(); };
    $("#fSabia").onclick = () => { marcarRevisao(it, true); certos++; salvarLocal(); pos++; passo(); };
  };
  passo();
}

/* ============================================================
   👨‍👩‍👧 RESUMO DA SEMANA PARA A FAMÍLIA (sem nome, só números)
   ============================================================ */
function textoResumoFamilia() {
  const hoje = hojeISO(), ini = somaDias(-6);
  const dm = (iso) => { const d = new Date(iso + "T12:00:00"); return `${DIAS_SEM[d.getDay()].slice(0, 3)} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`; };
  const linhas = [`📚 *Minha semana no EstudAÍ* (${dm(ini)} a ${dm(hoje)})`, ""];
  const prox = estado.tarefas.filter((t) => !t.feito && t.data && diasAte(t.data) >= 0 && diasAte(t.data) <= 14 && t.tipo !== "dever")
    .sort((a, b) => a.data.localeCompare(b.data)).slice(0, 6);
  linhas.push("📅 *Próximas provas e trabalhos*");
  if (prox.length) for (const t of prox) {
    const pr = t.tipo === "prova" ? ` · ${prontidao(t).pct}% pronto` : "";
    linhas.push(`• ${dm(t.data)}: ${TIPOS[t.tipo] || "Atividade"}${t.materia ? " de " + t.materia : ""}${t.titulo ? " (" + String(t.titulo).slice(0, 50) + ")" : ""}${pr}`);
  } else linhas.push("• Nada marcado para as próximas 2 semanas");
  linhas.push("");
  const soma = (nome) => Object.entries(estado.diario || {}).filter(([d]) => d >= ini && d <= hoje).reduce((a, [, v]) => a + (v[nome] || 0), 0);
  const feitas = estado.tarefas.filter((t) => t.feito && t.feitoEm && t.feitoEm >= ini).length;
  const minFoco = soma("minutosFoco"), rev = soma("revisoes"), rel = soma("relampagos"), duv = soma("duvidas");
  linhas.push("✅ *O que fiz nos últimos 7 dias*");
  const fez = [];
  if (feitas) fez.push(`• ${feitas} ${feitas === 1 ? "atividade concluída" : "atividades concluídas"}`);
  if (minFoco) fez.push(`• ${minFoco >= 60 ? Math.floor(minFoco / 60) + "h" + (minFoco % 60 ? String(minFoco % 60).padStart(2, "0") : "") : minFoco + " min"} estudando no modo foco`);
  if (rev) fez.push(`• ${rev} ${rev === 1 ? "revisão" : "revisões"} do dia`);
  if (rel) fez.push(`• ${rel} ${rel === 1 ? "quiz relâmpago" : "quizzes relâmpago"}`);
  if (duv) fez.push(`• ${duv} ${duv === 1 ? "dúvida tirada" : "dúvidas tiradas"}`);
  linhas.push(...(fez.length ? fez : ["• Semana mais tranquila por aqui"]));
  const n = estado.notas;
  if (n && temNotas(n.materias, n.extras)) {
    const ms = Object.keys(n.materias).map((m) => ({ m, s: situacaoNota(n.materias[m], n.media || 6, n.periodos || 4, (n.extras || {})[m]) })).filter((x) => x.s.media != null);
    if (ms.length) {
      const geral = ms.reduce((a, x) => a + (x.s.final != null ? Math.max(x.s.final, x.s.media) : x.s.media), 0) / ms.length;
      const abaixo = ms.filter((x) => (x.s.final != null ? x.s.final : x.s.media) < (n.media || 6)).map((x) => x.m);
      linhas.push("", "📒 *Notas*", `• Média geral: ${fmt1(geral)}`);
      if (abaixo.length) linhas.push(`• Preciso de atenção em: ${abaixo.join(", ")}`);
    }
  }
  linhas.push("", "Enviado pelo app EstudAÍ 💜");
  return linhas.join("\n");
}

/* ============================================================
   CRONOGRAMA — o aluno informa os horários e o app monta a semana
   ============================================================ */
const DIAS_SEM = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const VERSAO_APP = "21";
const CHAVE_DIA = { seg: 1, ter: 2, qua: 3, qui: 4, sex: 5, sab: 6 };
const BASE_MATERIAS = ["Matemática", "Português", "Ciências", "História", "Geografia", "Inglês"];
const toMin = (h) => { const [a, b] = String(h || "0:0").split(":").map(Number); return (a || 0) * 60 + (b || 0); };
const toHora = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const ehHora = (h) => /^\d{1,2}:\d{2}$/.test(h || "");
function diaDe(iso) { return new Date(iso + "T12:00:00").getDay(); }
function diasEntre(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000); }
// Matérias que não entram no cronograma de estudos (não precisam estudar em casa)
function semEstudo(m) {
  const SEM_ESTUDO = ["educacao fisica", "ed fisica", "edfisica", "ensino religioso", "religiao", "ens religioso"];
  const n = String(m || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  return n === "ef" || n === "er" || SEM_ESTUDO.some((x) => n === x || n.startsWith(x + " ") || n.replace(/ /g, "") === x.replace(/ /g, ""));
}
function dificuldadeInicial(m) { return semEstudo(m) ? 0 : 2; }
function numDia(iso) { return Math.floor(Date.parse(iso + "T12:00:00Z") / 86400000); }

function rotinaPadrao() {
  const dias = {};
  for (let d = 0; d < 7; d++) dias[d] = { aula: d >= 1 && d <= 5, ini: "07:00", fim: "12:30", materias: [] };
  const materias = {};
  BASE_MATERIAS.forEach((m) => materias[m] = 2);
  return { dias, atividades: [], acordar: "06:30", dormir: "22:00", minutos: 60, fds: "leve", materias };
}

/* horários livres de um dia (em minutos desde 00:00) */
function subtrair(livres, a, b) {
  const r = [];
  for (const [x, y] of livres) {
    if (b <= x || a >= y) { r.push([x, y]); continue; }
    if (a > x) r.push([x, a]);
    if (b < y) r.push([b, y]);
  }
  return r;
}
function intervalosLivres(rot, dow) {
  const dia = rot.dias[dow] || {};
  const fimDeSemana = (dow === 0 || dow === 6) && !dia.aula;
  const inicio = Math.max(toMin(rot.acordar) + 45, fimDeSemana ? 9 * 60 + 30 : 8 * 60);
  let livres = [[inicio, toMin(rot.dormir) - 30]];
  if (dia.aula) livres = subtrair(livres, toMin(dia.ini) - 30, toMin(dia.fim) + 90); // ida, volta e almoço
  livres = subtrair(livres, 12 * 60, 13 * 60);          // almoço
  livres = subtrair(livres, 19 * 60 + 30, 20 * 60);     // jantar
  for (const at of rot.atividades.filter((a) => +a.dia === dow && ehHora(a.ini) && ehHora(a.fim))) {
    livres = subtrair(livres, toMin(at.ini) - 20, toMin(at.fim) + 20);
  }
  return livres.filter(([a, b]) => b - a >= 25);
}
function minutosAlvo(rot, dow) {
  const dia = rot.dias[dow] || {};
  if ((dow === 0 || dow === 6) && !dia.aula) {
    if (rot.fds === "livre") return 0;
    if (rot.fds === "leve") return Math.max(30, Math.round(rot.minutos / 2 / 15) * 15);
  }
  return rot.minutos;
}
function horariosDoDia(rot, dow) {
  const alvo = minutosAlvo(rot, dow);
  const L = alvo <= 45 ? alvo : alvo <= 60 ? 30 : 45, pausa = 10;
  const blocos = []; let total = 0;
  for (const [a, b] of intervalosLivres(rot, dow)) {
    let t = a;
    while (total < alvo && t + 20 <= b) {
      const dur = Math.min(L, alvo - total, b - t);
      if (dur < 20) break;
      blocos.push([t, t + dur]); total += dur; t += dur + pausa;
    }
    if (total >= alvo) break;
  }
  return { blocos, alvo, total };
}

/* o que estudar em cada bloco */
function listaMaterias(rot) {
  return Object.entries(rot.materias).filter(([m, d]) => d > 0 && !semEstudo(m)).sort((a, b) => a[0].localeCompare(b[0]));
}
function tarefasDoDia(rot, iso, n) {
  const dow = diaDe(iso);
  const fila = [];
  for (const t of estado.tarefas.filter((x) => !x.feito && x.data)) {
    const dist = diasEntre(iso, t.data);
    const mat = t.materia || t.titulo;
    const mt = materialDaTarefa(t), rev = mt ? pendenciasRevisao(mt) : 0;
    if (t.tipo === "prova" && rev && [1, 2, 3, 5].includes(dist)) {
      const quando = dist === 1 ? "prova amanhã" : `prova em ${dist} dias`;
      const partes = [mt.erros && mt.erros.length ? `${mt.erros.length} ${mt.erros.length === 1 ? "cartão" : "cartões"}` : "", mt.quizErros && mt.quizErros.length ? `${mt.quizErros.length} ${mt.quizErros.length === 1 ? "questão" : "questões"}` : ""].filter(Boolean).join(" e ");
      fila.push({ prio: [0, 100, 92, 88, 0, 60][dist], materia: mat, texto: `🔁 Revisar ${partes} que você errou${dist === 1 ? " e refazer o simulado" : ""} · ${quando}`, tarefaId: t.id });
    } else if (t.tipo === "prova") {
      if (dist === 1) fila.push({ prio: 100, materia: mat, texto: `Simulado e revisão final · prova amanhã`, tarefaId: t.id });
      else if (dist === 2) fila.push({ prio: 92, materia: mat, texto: `Flashcards e exercícios · prova em 2 dias`, tarefaId: t.id });
      else if (dist === 3) fila.push({ prio: 88, materia: mat, texto: `Estudar o conteúdo e fazer o resumo · prova em 3 dias`, tarefaId: t.id });
      else if (dist === 5) fila.push({ prio: 60, materia: mat, texto: `Primeira leitura do conteúdo · prova em 5 dias`, tarefaId: t.id });
    } else if (t.tipo === "trabalho" || t.tipo === "apresentacao") {
      if (dist === 1) fila.push({ prio: 96, materia: mat, texto: t.tipo === "apresentacao" ? "Ensaiar a apresentação · é amanhã" : "Finalizar e revisar o trabalho · entrega amanhã", tarefaId: t.id });
      else if (dist >= 2 && dist <= 4) fila.push({ prio: 75, materia: mat, texto: `Avançar: ${t.titulo}`, tarefaId: t.id });
    } else if (dist === 1) {
      fila.push({ prio: 98, materia: mat, texto: `Fazer: ${t.titulo}`, tarefaId: t.id });
    }
  }
  const usadas = new Set(fila.map((f) => f.materia));
  // revisar a aula do dia (a matéria mais difícil que teve aula)
  const dia = rot.dias[dow] || {};
  if (dia.aula && dia.materias && dia.materias.length) {
    const aulas = [...new Set(dia.materias)].filter((m) => !usadas.has(m) && !semEstudo(m) && rot.materias[m] !== 0).sort((a, b) => (rot.materias[b] || 2) - (rot.materias[a] || 2));
    if (aulas[0]) { fila.push({ prio: 70, materia: aulas[0], texto: "Revisar a aula de hoje e refazer exemplos" }); usadas.add(aulas[0]); }
  }
  // rodízio: matérias difíceis aparecem mais vezes
  const roda = [];
  for (const [m, d] of listaMaterias(rot)) for (let k = 0; k < d; k++) roda.push(m);
  if (roda.length) {
    let i = (numDia(iso) * 3) % roda.length, voltas = 0;
    while (fila.length < n && voltas < roda.length * 2) {
      const m = roda[i % roda.length]; i++; voltas++;
      if (usadas.has(m)) continue;
      usadas.add(m);
      const d = rot.materias[m];
      fila.push({ prio: 10, materia: m, texto: d >= 3 ? "Exercícios (matéria difícil, vá com calma)" : d === 1 ? "Revisão rápida do caderno" : "Revisar o caderno e fazer exercícios" });
    }
  }
  return fila.sort((a, b) => b.prio - a.prio).slice(0, n);
}

function montarSemana() {
  const rot = estado.rotina; if (!rot) return [];
  const dias = [];
  for (let k = 0; k < 7; k++) {
    const d = new Date(hojeISO() + "T12:00:00"); d.setDate(d.getDate() + k);
    const iso = d.toISOString().slice(0, 10);
    const { blocos, alvo } = horariosDoDia(rot, d.getDay());
    const tarefas = tarefasDoDia(rot, iso, blocos.length);
    dias.push({
      iso, dow: d.getDay(), alvo,
      blocos: blocos.slice(0, tarefas.length).map(([a, b], i) => ({ ...tarefas[i], ini: toHora(a), fim: toHora(b), chave: `${iso}|${tarefas[i].materia}|${tarefas[i].texto}` })),
      semHorario: alvo > 0 && blocos.length === 0,
    });
  }
  return dias;
}

function renderCronograma() {
  const alvo = $("#conteudoCrono");
  if (!estado.rotina) {
    alvo.innerHTML = `
      <div class="hero">
        <div class="titulo">Seu cronograma de estudos.</div>

      </div>`;
    $("#btnConfigCrono").onclick = configurarRotina;

  }
  // limpa marcações antigas
  const limite = hojeISO();
  for (const k of Object.keys(estado.feitosCrono)) if (k.slice(0, 10) < limite) delete estado.feitosCrono[k];
  const semana = montarSemana();
  const hoje = semana[0];

  let html = `

      <p>${estado.rotina.minutos} min por dia · ${totalSemana} blocos nos próximos 7 dias. O plano se ajusta sozinho quando você salva provas na agenda.</p>
      <div class="linha">

        <button class="botao claro" id="btnCalCrono">📅 Calendário</button>
      </div>
    </div>`;
  for (const d of semana) {
    const nome = d.iso === hojeISO() ? "Hoje" : diasEntre(hojeISO(), d.iso) === 1 ? "Amanhã" : DIAS_SEM[d.dow];
    const data = new Date(d.iso + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });

      continue;
    }
    html += `<div class="lista">${d.blocos.map((b) => {
      const feito = !!estado.feitosCrono[b.chave];
      const t = b.tarefaId && estado.tarefas.find((x) => x.id === b.tarefaId);
      const podeEstudar = t && ["prova", "trabalho", "apresentacao"].includes(t.tipo);
      return `<div class="card tarefa ${feito ? "feita" : ""}" data-chave="${esc(b.chave)}">

        </div></div>`;
    }).join("")}</div>`;
  }
  alvo.innerHTML = html;
  $("#btnEditarCrono").onclick = configurarRotina;
  $("#btnCalCrono").onclick = () => baixarSemanaCalendario(semana);
}
$("#conteudoCrono").addEventListener("click", (ev) => {

});

let configurarRotinaReabrir = () => {};

function aplicarHorario(r, resp) {
  const dias = resp && resp.dias && typeof resp.dias === "object" ? resp.dias : {};
  let algum = false;
  for (const [k, v] of Object.entries(dias)) {
    const d = CHAVE_DIA[String(k).toLowerCase().slice(0, 3).replace("á", "a")];
    if (!d || !v) continue;
    algum = true;
    const mats = (Array.isArray(v.materias) ? v.materias : []).map(String).map((x) => x.trim()).filter(Boolean).slice(0, 12);
    r.dias[d] = { aula: true, ini: ehHora(v.inicio) ? v.inicio.padStart(5, "0") : r.dias[d].ini, fim: ehHora(v.fim) ? v.fim.padStart(5, "0") : r.dias[d].fim, materias: mats };
    for (const m of mats) if (!(m in r.materias)) r.materias[m] = dificuldadeInicial(m);
  }
  if (algum) for (let d = 1; d <= 6; d++) if (!Object.keys(dias).some((k) => CHAVE_DIA[String(k).toLowerCase().slice(0, 3).replace("á", "a")] === d)) r.dias[d].aula = false;
  return algum;
}

/* exporta a semana para o calendário do celular */
function baixarSemanaCalendario(semana) {
  const limpar = (s) => String(s || "").replace(/[\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const agora = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const linhas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Estudai//PT-BR", "CALSCALE:GREGORIAN"];
  let n = 0;
  for (const d of semana) for (const b of d.blocos) {
    const dt = d.iso.replace(/-/g, "");
    linhas.push("BEGIN:VEVENT", `UID:${dt}-${b.ini.replace(":", "")}-${n++}@estudai`, `DTSTAMP:${agora}`,
      `DTSTART:${dt}T${b.ini.replace(":", "")}00`, `DTEND:${dt}T${b.fim.replace(":", "")}00`,
      `SUMMARY:${limpar("📚 " + b.materia)}`, `DESCRIPTION:${limpar(b.texto)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${limpar("Hora de estudar " + b.materia)}`, "TRIGGER:-PT5M", "END:VALARM", "END:VEVENT");
  }
  if (!n) { toast("Não há blocos de estudo nos próximos dias."); return; }
  linhas.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([linhas.join("\r\n")], { type: "text/calendar;charset=utf-8" }));
  a.download = "cronograma-estudos.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`Abra o arquivo para pôr os ${n} blocos no calendário. Ele avisa 5 min antes de cada um.`, 4500);
}
